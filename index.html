<html lang="de">

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">

<title>Markt-Tycoon · by Nextform Games</title>
<style>
:root{
  --bg:#eef0ee; --panel:#ffffff; --ink:#23303a; --ink-soft:#5b6b76;
  --accent:#ff7a00; --accent-dark:#d96600; --green:#1f8a4d; --red:#d33a2f;
  --radius:14px; --shadow:0 4px 14px rgba(35,48,58,.12);
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
input{user-select:text;-webkit-user-select:text}
html,body{height:100%;overscroll-behavior:none}
body{
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
  background:var(--bg);color:var(--ink);
  display:flex;flex-direction:column;height:100dvh;
  user-select:none;-webkit-user-select:none;touch-action:manipulation;
}
#topbar{
  background:var(--ink);color:#fff;
  padding:calc(env(safe-area-inset-top) + 8px) 12px 8px;
  display:flex;align-items:center;justify-content:space-between;gap:8px;flex-shrink:0;
}
#topbar .money{font-size:19px;font-weight:800;color:#ffd28f}
#topbar .mid{text-align:center;line-height:1.15}
#topbar .day{font-size:13px;font-weight:700}
#topbar .clock{font-size:11.5px;color:#b9c6cf}
#topbar .clean{font-size:12px;text-align:right;line-height:1.2}
.cleanbar{width:64px;height:6px;background:#3b4b58;border-radius:3px;overflow:hidden;margin-top:3px;margin-left:auto}
#moneyFx{position:absolute;top:52px;left:10px;z-index:30;pointer-events:none;display:flex;flex-direction:column;gap:3px;align-items:flex-start}
.mfx{background:rgba(22,30,38,.88);padding:2.5px 9px;border-radius:9px;font-size:11px;font-weight:800;
  animation:mfxUp 1.6s ease forwards;box-shadow:0 2px 8px rgba(0,0,0,.25)}
.mfx.plus{color:#7dffb0}
.mfx.minus{color:#ff9a8a}
@keyframes mfxUp{0%{transform:translateY(6px);opacity:0}12%{transform:none;opacity:1}75%{opacity:1}100%{transform:translateY(-8px);opacity:0}}
.tl{position:relative;height:9px;background:#e9edf0;border-radius:4px;margin-top:5px;overflow:hidden}
.tlSeg{position:absolute;top:0;height:9px;border-radius:3px;opacity:.85}
.tlNow{position:absolute;top:-1px;height:11px;width:2px;background:var(--red)}
#reqBox{position:absolute;left:10px;right:10px;bottom:66px;z-index:18;display:flex;flex-direction:column;gap:6px;pointer-events:none}
.reqCard{pointer-events:auto;background:rgba(28,36,44,.94);color:#fff;border-radius:12px;padding:8px 10px;
  display:flex;align-items:center;gap:8px;font-size:12.5px;box-shadow:0 4px 14px rgba(0,0,0,.3);
  animation:reqIn .25s ease}
.reqCard span{flex:1;min-width:0}
.reqCard .chip{margin:0;padding:7px 11px;background:#3a4753;border-color:transparent;color:#fff}
@keyframes reqIn{from{transform:translateY(14px);opacity:0}to{transform:none;opacity:1}}
.cleanbar>i{display:block;height:100%;background:var(--green);border-radius:3px;transition:width .4s}
#stage{flex:1;position:relative;overflow:hidden;background:#7fae70}
canvas{display:block;touch-action:none;position:absolute;left:50%;top:50%;transform:translate(-50%,-50%)}
#zoomBtn, #setBtn{
  position:absolute;right:10px;z-index:5;
  width:44px;height:44px;border-radius:50%;border:0;
  background:rgba(35,48,58,.85);color:#fff;font-size:19px;
  box-shadow:var(--shadow);cursor:pointer;
}
#zoomBtn{bottom:10px}
#setBtn{top:10px}
#panHint{
  position:absolute;left:50%;top:12px;transform:translateX(-50%);z-index:5;
  background:rgba(35,48,58,.8);color:#fff;font-size:12px;font-weight:700;
  padding:7px 14px;border-radius:12px;pointer-events:none;transition:opacity .5s;
}
#nav{
  flex-shrink:0;display:flex;background:var(--panel);
  border-top:1px solid #dde3e6;
  padding:6px 6px calc(env(safe-area-inset-bottom) + 6px);gap:4px;
}
#nav button{
  flex:1;border:0;background:none;color:var(--ink-soft);
  font-size:10.5px;font-weight:700;font-family:inherit;
  display:flex;flex-direction:column;align-items:center;gap:2px;
  padding:6px 2px;border-radius:10px;cursor:pointer;
}
#nav button .ic{font-size:21px;line-height:1}
#nav button.active{background:#fff3e5;color:var(--accent-dark)}
.overlay{position:fixed;inset:0;background:rgba(20,28,34,.45);display:none;align-items:flex-end;justify-content:center;z-index:50}
.overlay.show{display:flex}
.sheet{background:var(--panel);width:100%;max-width:520px;border-radius:20px 20px 0 0;max-height:78dvh;display:flex;flex-direction:column;animation:up .22s ease}
@keyframes up{from{transform:translateY(40px);opacity:.5}to{transform:none;opacity:1}}
.sheet header{padding:14px 16px 10px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid #eef1f3;flex-shrink:0}
.sheet header h2{font-size:17px;font-weight:800}
.sheet header .sub{font-size:12px;color:var(--ink-soft);font-weight:600}
.x{border:0;background:#eef1f3;color:var(--ink);width:30px;height:30px;border-radius:50%;font-size:15px;font-weight:800;cursor:pointer;font-family:inherit}
.sheet .body{overflow-y:auto;padding:10px 14px calc(env(safe-area-inset-bottom) + 14px);-webkit-overflow-scrolling:touch}
.row{display:flex;align-items:center;gap:10px;padding:10px 4px;border-bottom:1px solid #f2f4f5}
.row:last-child{border-bottom:0}
.row .em{font-size:26px;width:34px;text-align:center;flex-shrink:0}
.row .info{flex:1;min-width:0}
.row .info b{font-size:14px;display:block}
.row .info small{font-size:11.5px;color:var(--ink-soft);display:block;margin-top:1px}
.btn{border:0;font-family:inherit;font-weight:800;font-size:12.5px;background:var(--accent);color:#fff;padding:9px 13px;border-radius:11px;cursor:pointer;flex-shrink:0}
.btn:active{background:var(--accent-dark)}
.btn.sec{background:#eef1f3;color:var(--ink)}
.btn.danger{background:#fdecea;color:var(--red)}
.btn.green{background:var(--green)}
.btn:disabled{opacity:.4}
.tag{display:inline-block;font-size:10px;font-weight:800;padding:2px 7px;border-radius:8px;background:#eef1f3;color:var(--ink-soft);vertical-align:middle;margin-left:5px}
.tag.season{background:#fff3e5;color:var(--accent-dark)}
.tag.flop{background:#fdecea;color:var(--red)}
.tag.hit{background:#e7f5ec;color:var(--green)}
.secTitle{font-size:12px;font-weight:800;color:var(--ink-soft);text-transform:uppercase;letter-spacing:.4px;margin:14px 4px 4px}
.progress{height:9px;background:#eef1f3;border-radius:5px;overflow:hidden;margin:6px 4px 2px}
.progress>i{display:block;height:100%;background:linear-gradient(90deg,var(--accent),#ffb35c);border-radius:5px;transition:width .4s}
.hourCtl{display:flex;align-items:center;gap:8px}
.hourCtl b{min-width:52px;text-align:center;font-size:15px}
.hourCtl .btn{padding:7px 12px}
.dialogWrap{position:fixed;inset:0;background:rgba(20,28,34,.55);display:none;align-items:center;justify-content:center;z-index:60;padding:20px}
.dialogWrap.show{display:flex}
.dialog{background:var(--panel);border-radius:20px;width:100%;max-width:400px;padding:20px 18px;box-shadow:var(--shadow);animation:up .22s ease;max-height:80dvh;overflow-y:auto}
.dialog h2{font-size:19px;font-weight:800;margin-bottom:2px}
.dialog .sub{font-size:12.5px;color:var(--ink-soft);margin-bottom:12px}
.stat{display:flex;justify-content:space-between;font-size:14px;padding:7px 0;border-bottom:1px solid #f2f4f5}
.stat b.plus{color:var(--green)} .stat b.minus{color:var(--red)}
.stat.total{border-top:2px solid var(--ink);border-bottom:0;margin-top:4px;font-weight:800;font-size:15px}
.dialog .btn{width:100%;margin-top:14px;padding:13px;font-size:14px}
.dialog .row .btn{width:auto;margin-top:0;padding:9px 13px;font-size:12.5px}
.chipRow{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0 12px}
.chip{border:2px solid #dde3e6;background:#fff;border-radius:12px;padding:7px 10px;
  font-family:inherit;font-weight:800;font-size:13px;color:var(--ink);cursor:pointer}
.chip.on{border-color:var(--accent);background:#fff3e5;color:var(--accent-dark)}
.chip.big{font-size:17px;padding:8px 11px}
.planTitle{font-size:12.5px;font-weight:800;color:var(--ink-soft);margin:12px 0 2px;text-transform:uppercase;letter-spacing:.3px}
#toast{
  position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom) + 86px);
  transform:translateX(-50%) translateY(20px);
  background:var(--ink);color:#fff;font-size:13px;font-weight:700;
  padding:10px 16px;border-radius:14px;opacity:0;pointer-events:none;
  transition:.25s;z-index:70;white-space:nowrap;max-width:92vw;overflow:hidden;text-overflow:ellipsis;
}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
#toast.big{background:var(--accent);font-size:14px;padding:12px 20px}
</style>
</head>

const SAVE_KEY = "maert_tycoon_v1";
let canStore = true;
function save(){
  if(!canStore) return;
  try{ S.lastSave=Date.now(); localStorage.setItem(SAVE_KEY, JSON.stringify(S)); }
  catch(e){ canStore=false; }
}
function load(){
  try{
    const raw=localStorage.getItem(SAVE_KEY);
    if(!raw) return false;
    const d=JSON.parse(raw);
    if(!d) return false;
    if(d.v===1){ // Migration von der alten Version
      const n=defaultState();
      ["money","day","staff","staffRoom","assortment","lager","stats","lifetime","kassen","selfscans","depts","billboard","busstop","reno","tutorialDone"].forEach(k=>{ if(d[k]!==undefined) n[k]=d[k]; });
      n.hallShelves=Math.min(6, Array.isArray(d.shelves)? d.shelves.length : 3);
      n.shelves={};
      if(Array.isArray(d.shelves)) d.shelves.forEach((sh,i)=>{ if(i<n.hallShelves) n.shelves["h"+i]={parts:[{prod:sh.prod||null, units:sh.units||0}]}; });
      n.kassen=Math.min(n.kassen, LEVELS[0].maxK);
      n.selfscans=Math.min(n.selfscans, LEVELS[0].maxS);
      S=n; ensureStats(); return true;
    }
    if(d.v===2){
      const n=Object.assign(defaultState(), d);
      n.v=3;
      // Regale: {prod,units} -> {parts:[...]}
      const sh={};
      Object.keys(d.shelves||{}).forEach(k=>{
        const o=d.shelves[k];
        sh[k]= o && o.parts ? o : {parts:[{prod:(o&&o.prod)||null, units:(o&&o.units)||0}]};
      });
      {
        const lv=Math.max(1,Math.min(5,Math.round((20+(n.level||0)*5)/10)));
        Object.values(sh).forEach(x=>{ if(!x.lvl) x.lvl=lv; });
      }
      n.shelves=sh;
      ["liqSet","prodLvl"].forEach(k=>{ if(typeof n[k]!=="object"||!n[k]) n[k]={}; });
      Object.keys(n.priceAdj||{}).forEach(id=>{             // Alt: Preisaufschlag -> Qualitätsstufe
        const adj=n.priceAdj[id];
        if(adj>=2.5) n.prodLvl[id]=3; else if(adj>0) n.prodLvl[id]=Math.max(n.prodLvl[id]||1,2);
      });
      n.priceAdj={};
      S=n; ensureStats(); return true;
    }
    if(d.v!==3) return false;
    S=Object.assign(defaultState(), d);
    if(typeof S.prodLvl!=="object"||!S.prodLvl) S.prodLvl={};
    Object.keys(S.priceAdj||{}).forEach(id=>{
      const adj=S.priceAdj[id];
      if(adj>=2.5) S.prodLvl[id]=3; else if(adj>0) S.prodLvl[id]=Math.max(S.prodLvl[id]||1,2);
    });
    S.priceAdj={};
    {
      const lv=Math.max(1,Math.min(5,Math.round((20+(S.level||0)*5)/10)));
      Object.keys(S.shelves||{}).forEach(k=>{
        const o=S.shelves[k];
        if(o && !o.parts) S.shelves[k]={parts:[{prod:o.prod||null,units:o.units||0}], lvl:o.lvl||lv};
        else if(o && !o.lvl) o.lvl=lv;
      });
    }
    if((S.camTier||0)>0 || (S.gateTier||0)>0){
    const back=(S.camTier||0)*150+(S.gateTier||0)*220;
    S.money+=back; S.camTier=0; S.gateTier=0;
    setTimeout(()=>toast(`♻️ Kameras & Schranken abgeschafft – ${fmtS(back)} zurückerstattet. Dafür lohnen sich gefasste Diebe jetzt richtig!`, true), 900);
  }
  if(typeof S.mood!=="number") S.mood=85;
    ["lunchPlan","breaks","moodBy","shiftBy"].forEach(k=>{ if(typeof S[k]!=="object"||!S[k]) S[k]={}; });
  Object.keys(S.lunchPlan).forEach(k=>{ if(!Array.isArray(S.lunchPlan[k])) delete S.lunchPlan[k]; });
  Object.keys(S.breaks).forEach(k=>{ if(k.indexOf("_")<0) delete S.breaks[k]; });   // altes Rollen-Format
    ensureStats(); return true;
  }catch(e){ canStore=false; return false; }
}

const $ = id => document.getElementById(id);
const fmt = n => "CHF " + (Math.round(n*20)/20).toFixed(2).replace(/\.00$/,".–");
const fmtS = n => "CHF " + Math.round(n).toLocaleString("de-CH");
function season(){ return SEASONS[Math.floor((S.day-1)/5)%4]; }
const PLVL_MULT=[1,1.25,1.55], PLVL_POP=[1,1.05,1.10];
function prodLvl(id){ return (S.prodLvl&&S.prodLvl[id])||1; }
function vkOf(id){ return P[id].vk*PLVL_MULT[prodLvl(id)-1]; }
function isPromo(id){ return S.promoId===id && S.promoDay===S.day; }
function isLiq(id){
  if(!S.liqPct) return false;
  return S.liqAll || (S.liqDay===S.day && S.liqSet && S.liqSet[id]);
}
function vkEff(id){
  let v=vkOf(id);
  if(isLiq(id)) v*= (1-S.liqPct);
  return Math.max(0.1, Math.round(v*20)/20);
}
function popOf(p){
  let v = !p.season ? p.pop : (p.season===season() ? p.pop*3 : p.pop*0.25);
  if(isPromo(p.id)) v*=2;                                 // Aktion zieht Kundschaft an
  if(isLiq(p.id)) v*= 1 + S.liqPct*4;                     // Ausverkauf: je mehr Rabatt, desto begehrter
  v *= PLVL_POP[prodLvl(p.id)-1];                          // Premium-Qualität zieht Kundschaft an
  return v;
}
function scanTime(){ return [3.5,2.8,2.2][S.scanTier-1]||3.5; }
function kasseRate(){ return [2.6,2.0,1.5][S.kasseTier-1]||2.6; }
function guardAvail(){ return Math.max(0, staffOn("sicherheit") - (GUARD.busy?1:0)); }
function theftChance(){
  return Math.max(0.04, 0.20 - guardAvail()*0.08);
}
function cleanPct(){ return Math.max(0, Math.min(100, 100 - dirt.length*6 - odirt.length*4)); }
function staffEff(){ return (S.staffRoom<30 ? 0.5 : 1 + 0.08*(S.staffRoomLvl-1)) * (0.7 + 0.5*(S.mood||85)/100); }
function dayLen(){ return (S.closeH-S.openH)*50; }   // 12h = 600s
function dayHour(){ return S.openH + (S.t/dayLen())*(S.closeH-S.openH); }
function pricedHours(a,b){
  const normal=Math.max(0, Math.min(b,20)-Math.max(a,8));
  const extra=(b-a)-normal;
  return normal + extra*1.5;
}
function hoursFactor(){ return pricedHours(S.openH,S.closeH)/12; }
const SHIFTS={
  full:{name:"Ganzer Tag", emoji:"🕗"},
  morning:{name:"Vormittag", emoji:"🌅"},
  evening:{name:"Nachmittag", emoji:"🌆"},
};
function shiftModeRange(s){
  if(s==="morning") return [S.openH, Math.min(13,S.closeH)];
  if(s==="evening") return [Math.max(13,S.openH), S.closeH];
  return [S.openH, S.closeH];
}
function shiftArr(k){
  if(!S.shiftBy) S.shiftBy={};
  let a=S.shiftBy[k];
  if(!Array.isArray(a)) a=S.shiftBy[k]=[];
  const def=(S.staffShift&&S.staffShift[k])||"full";
  while(a.length<(S.staff[k]||0)) a.push(def);
  if(a.length>(S.staff[k]||0)) a.length=S.staff[k]||0;
  return a;
}
function empShiftRange(k,i){ return shiftModeRange(shiftArr(k)[i]||"full"); }
function empShiftOn(k,i){ const h=dayHour(), r=empShiftRange(k,i); return h>=r[0] && h<r[1]; }
function shiftRange(k){                        // Rollen-Hülle (frühester Start, spätestes Ende)
  const a=shiftArr(k);
  if(!a.length) return [S.openH, S.closeH];
  let lo=99, hi=-1;
  a.forEach(s=>{ const r=shiftModeRange(s); lo=Math.min(lo,r[0]); hi=Math.max(hi,r[1]); });
  return [lo,hi];
}
function shiftHours(k){ const r=shiftRange(k); return Math.max(0, r[1]-r[0]); }
const LUNCH_SLOTS=["11","12","13"];
const EMP_NAMES=["Lena","Marco","Aisha","Timo","Sofia","Nils","Elif","Jonas","Mara","Luca","Ida","Rafael","Noe","Selin","Fabio","Zoe"];
function empName(k,i){
  const off={kassierer:0,auffueller:5,putz:9,sicherheit:12}[k]||0;
  return EMP_NAMES[(off+i*3)%EMP_NAMES.length];
}
function moodArr(k){
  if(!S.moodBy) S.moodBy={};
  let a=S.moodBy[k];
  if(!Array.isArray(a)) a=S.moodBy[k]=[];
  while(a.length<(S.staff[k]||0)) a.push(Math.round(S.mood||80));
  if(a.length>(S.staff[k]||0)) a.length=S.staff[k]||0;
  return a;
}
function empOnPause(k,i){
  const b=S.breaks&&S.breaks[k+"_"+i];
  return !!(b && b.day===S.day && dayHour()<b.until);
}
function empAway(k,i){ return empAtLunch(k,i) || empOnPause(k,i); }
function lunchArr(k){
  let a=S.lunchPlan[k];
  if(!Array.isArray(a)){
    const base=(typeof a==="string" && LUNCH_SLOTS.includes(a))? a : "11";
    a=S.lunchPlan[k]=Array.from({length:S.staff[k]||0}, (_,i)=> i===0? base : LUNCH_SLOTS[i%3]);
  }
  while(a.length<(S.staff[k]||0)) a.push(LUNCH_SLOTS[a.length%3]);
  if(a.length>(S.staff[k]||0)) a.length=S.staff[k]||0;
  return a;
}
function empLunchSlots(k,i){
  const r=empShiftRange(k,i);
  return LUNCH_SLOTS.filter(s=> +s>=r[0] && +s<r[1] && r[1]-r[0]>5);   // halbe Schichten: keine Mittagspause
}
function empAtLunch(k,i){
  if(!empLunchSlots(k,i).length) return false;
  const h=dayHour();
  const sl=+(lunchArr(k)[i]||"11");
  return h>=sl && h<sl+1;
}
function lunchAway(k){
  let n=0;
  for(let i=0;i<(S.staff[k]||0);i++) if(empAtLunch(k,i)) n++;
  return n;
}
function onBreak(k){
  let allP=(S.staff[k]||0)>0;
  for(let i=0;i<(S.staff[k]||0);i++) if(!empOnPause(k,i)) allP=false;
  if(allP && (S.staff[k]||0)>0) return "pause";
  if((S.staff[k]||0)>0 && lunchAway(k)>=S.staff[k]) return "lunch";
  return null;
}
function staffOn(k){
  if(!S.staff[k]) return 0;
  let n=0;
  for(let i=0;i<S.staff[k];i++) if(empShiftOn(k,i) && !empAway(k,i)) n++;
  return n;
}
function empCost(k,i){
  const r=empShiftRange(k,i);
  return Math.round(STAFF[k].wage*Math.max(0,pricedHours(r[0],r[1]))/12);
}
function wagesPerDay(){
  let sum=0;
  Object.keys(STAFF).forEach(k=>{
    for(let i=0;i<(S.staff[k]||0);i++) sum+=empCost(k,i);
  });
  return Math.round(sum);
}
function trafficMult(){
  const h=dayHour();
  let v = 0.45
    + 1.15*Math.exp(-Math.pow((h-12.2)/1.7,2))
    + 0.55*Math.exp(-Math.pow((h-17.6)/1.4,2));
  if(h<7 || h>21) v*=0.35;   // Nachtstunden: nur Nachtschwärmer
  return v;
}
function toast(msg,big){
  const el=$("toast"); el.textContent=msg;
  el.classList.toggle("big",!!big); el.classList.add("show");
  clearTimeout(toast._t); toast._t=setTimeout(()=>el.classList.remove("show"), big?3200:2200);
}
function clockStr(){
  const h=dayHour();
  const hh=Math.floor(h), mm=Math.floor((h-hh)*60);
  return String(hh).padStart(2,"0")+":"+String(mm).padStart(2,"0");
}

function worstOverdue(){
  let w=null;
  S.invoices.forEach(v=>{ if(S.day>v.due && (!w || v.due<w.due)) w=v; });
  return w;
}
function avgRevenue(){
  if(!S.revHist.length) return null;
  return S.revHist.reduce((a,b)=>a+b,0)/S.revHist.length;
}
function completion(){
  const L=LV();
  let have=0, tot=0;
  tot+=L.hallSlots;      have+=S.hallShelves;
  tot+=4;                have+=S.depts.length-1;
  tot+=L.maxK-1;         have+=S.kassen-1;
  tot+=L.maxS-1;         have+=S.selfscans-1;
  tot+=3;                have+=(S.billboard?1:0)+(S.busstop?1:0)+(S.reno?1:0);
  tot+=1;                have+=(S.office?1:0);
  tot+=3;                have+=S.staffRoomLvl-1;
  tot+=2;                have+=S.shelfTier-1;
  tot+=2;                have+=S.kasseTier-1;
  tot+=2;                have+=S.scanTier-1;
  tot+=3;                have+=S.parkMeterTier;
  tot+=6;                have+=6*Math.min(1, S.parking/L.parkCap);
  return Math.min(1, have/tot);
}

/* ================= LAYOUT-BAUKASTEN ================= */
/* Die Welt wird pro Level aufgebaut. Flügel (Anbauten) haben immer
   reservierten Platz und erscheinen, sobald die Abteilung gekauft ist. */
let LY=null;
function buildLayout(){
  SPRC.clear();
  const L=LV();
  const WING_W=132, M=24, SR_H=102, CO_H=36, OF_W=112;
  const worldW=M*2+WING_W*2+L.hallW;
  // Hinterhaus-Raster
  const backHalfW=L.hallW/2-30;
  const backCols=Math.max(1, Math.floor((backHalfW-51-66-6)/112)+1);
  const backRows=Math.ceil(L.backHalf/backCols);
  const BACK_H=58+(backRows-1)*64+22+38;

  // ---- EIN zusammenhängendes Gebäude: Personal-Etage + Gang + Hinterhaus + Halle ----
  const srY=M;
  const gang={x:M+2, y:srY+SR_H, w:worldW-2*M-4, h:CO_H};
  // Personalräume als Segmente der obersten Etage (durch Innenwände getrennt)
  const segW=gang.w;
  const lager ={x:gang.x,                 y:srY, w:Math.round(segW*0.32), h:SR_H};
  const staffR={x:lager.x+lager.w,        y:srY, w:Math.round(segW*0.30), h:SR_H};
  const ruhe  ={x:staffR.x+staffR.w,      y:srY, w:Math.round(segW*0.19), h:SR_H};
  const tech  ={x:ruhe.x+ruhe.w,          y:srY, w:gang.x+gang.w-(ruhe.x+ruhe.w), h:SR_H};

  const hasBL=S.depts.includes("fleisch"), hasBR=S.depts.includes("nonfood");
  const hasBack=hasBL||hasBR;
  const backY=gang.y+gang.h;
  const hallX=M+WING_W;
  const hallY= hasBack? backY+BACK_H : backY;
  const hall={x:hallX, y:hallY, w:L.hallW, h:L.hallH};
  const aisleX=hall.x+hall.w/2;
  const plazaTop=hall.y+hall.h+24;
  const roadY=plazaTop+112;
  const parkTop=roadY+62;
  const perRowP=Math.max(6, Math.floor((worldW-70)/46));
  const parkRows=Math.ceil(L.parkCap/perRowP);
  const worldH=parkTop+30+parkRows*48+22;

  const slots=[];
  // ---- Kassenzone & Diebstahlbüro (vorne rechts, bei den Self-Scans) ----
  const doorY0=hall.y+hall.h-8;
  const door={x:aisleX, y:doorY0-6};
  const ckY=doorY0-118;
  const office={x:hall.x+hall.w-OF_W-8, y:ckY-84, w:OF_W, h:(doorY0-8)-(ckY-84)};
  const kassePos=[];
  {
    const cand=[];
    for(let kx=hall.x+56; kx<office.x-42; kx+=60){
      if(Math.abs(kx-aisleX)<56) continue;           // Türbereich frei
      cand.push(kx);
    }
    cand.sort((a,b)=>Math.abs(a-aisleX)-Math.abs(b-aisleX));  // näheste zuerst: neue Kassen wachsen seitlich an
    cand.slice(0,L.maxK).forEach(kx=>kassePos.push({x:kx, y:ckY}));
  }
  // Self-Scan-Reihe über die volle Breite (Mittelgang & Büro ausgespart)
  const scanXs=[];
  for(let sx=office.x-30; sx>hall.x+36; sx-=46){
    if(Math.abs(sx-aisleX)<36) continue;             // Mittelgang frei
    scanXs.push(sx);
  }
  const perRow=Math.max(1, scanXs.length);
  const scanRows=Math.ceil(L.maxS/perRow);
  const oldPods=(LY&&LY.scanPods&&LY.scanPods.length===L.maxS)? LY.scanPods : null;
  const scanPods=[];
  for(let i=0;i<L.maxS;i++){
    const r=Math.floor(i/perRow), cI=i%perRow;
    scanPods.push({x:scanXs[cI], y:ckY-78-r*40, busy: oldPods? oldPods[i].busy : null});
  }
  const scanTop=ckY-78-(scanRows-1)*40;
  const shelfBottom=Math.min(scanTop, office.y)-64;
  const scanAnchor={x:office.x-40, y:ckY-38};   // freie Spur zwischen Scans und Kassen

  // ---- Halle: Regalreihen ----
  const rows=Math.ceil(L.hallSlots/2);
  let rowY0=hall.y+100;
  let rowGap=Math.min(68, (shelfBottom-rowY0)/Math.max(1,rows-1));
  if(rowGap<50){ rowY0=Math.max(hall.y+84, shelfBottom-(rows-1)*50); rowGap=(shelfBottom-rowY0)/Math.max(1,rows-1); }
  for(let r=0;r<rows;r++){
    for(let cI=0;cI<2;cI++){
      const idx=r*2+cI; if(idx>=L.hallSlots) break;
      const side=cI===0?"L":"R";
      const x=side==="L"? hall.x+92 : hall.x+hall.w-92;
      const y=rowY0+r*rowGap;
      slots.push({id:"h"+idx, zone:"hall", side, x, y,
        appr:{x: side==="L"? x+58 : x-58, y:y+4},
        route:[{x:aisleX,y:y+4},{x:side==="L"? x+58:x-58,y:y+4}]});
    }
  }
  // ---- Flügel (Gemüse links, Käse rechts) – angebaut, mit Türe zur Halle ----
  function wing(sideKey, dept){
    const isL=sideKey==="left";
    const wx=isL? M : hallX+L.hallW;
    const w={x:wx, y:hall.y+70, w:WING_W, h:Math.min(hall.h-160, 96+L.wingSlots*64)};
    w.doorY=w.y+w.h/2;
    w.corrX=isL? w.x+WING_W-34 : w.x+34;
    w.dept=dept;
    w.slots=[];
    for(let i=0;i<L.wingSlots;i++){
      const y=w.y+58+i*64;
      if(y>w.y+w.h-26) break;
      const x=isL? w.x+52 : w.x+WING_W-52;
      const s={id:(isL?"L":"R")+i, zone:dept, side:isL?"L":"R", x, y,
        appr:{x:isL? x+52 : x-52, y:y+4},
        route:[{x:aisleX,y:w.doorY},{x:w.corrX,y:w.doorY},{x:w.corrX,y:y+4},{x:isL? x+52:x-52,y:y+4}]};
      slots.push(s); w.slots.push(s);
    }
    return w;
  }
  const left  = S.depts.includes("gemuese")? wing("left","gemuese") : null;
  const right = S.depts.includes("kaese")?   wing("right","kaese")  : null;

  // ---- Hinterhaus: Fleisch & NonFood, getrennt durch begehbaren Flur (Wirbelsäule) ----
  let back=null, backL=null, backR=null;
  if(hasBack){
    back={x:hall.x, y:backY, w:hall.w, h:BACK_H, corrY:backY+BACK_H-30, hasBL, hasBR};
    backL={x:hall.x, y:backY, w:hall.w/2-30, h:BACK_H};
    backR={x:aisleX+30, y:backY, w:hall.w/2-30, h:BACK_H};
    const mkBack=(half,room,prefix,dept)=>{
      const startX=room.x+66;
      for(let i=0;i<L.backHalf;i++){
        const col=i%backCols, r=Math.floor(i/backCols);
        const x=startX+col*112;
        if(x+51>room.x+room.w-6) break;
        const y=back.y+58+r*64;
        const chX=x+56;
        slots.push({id:prefix+i, zone:dept, side:"B", x, y,
          appr:{x:chX, y:y+4},
          route:[{x:aisleX,y:hall.y+52},{x:aisleX,y:back.corrY},{x:chX,y:back.corrY},{x:chX,y:y+4}]});
      }
    };
    if(hasBL) mkBack("L", backL, "F", "fleisch");
    if(hasBR) mkBack("R", backR, "N", "nonfood");
  }

  const spaces=[];
  for(let i=0;i<L.parkCap;i++){
    spaces.push({x:42+(i%perRowP)*46+18, y:parkTop+30+Math.floor(i/perRowP)*48});
  }
  LY={worldW, worldH, hall, aisleX, left, right, back, backL, backR,
      gang, srY, lager, staffR, ruhe, tech, office,
      door, kassePos, scanPods, scanAnchor, slots, plazaTop, roadY,
      parkTop, spaces, perRowP,
      busStop:{x:hall.x-40, y:plazaTop+72},
      billboard:{x:hall.x+hall.w+34, y:plazaTop+52},
      storeTop: srY};
}
function slotById(id){ return LY.slots.find(s=>s.id===id); }
function activeSlots(){
  return LY.slots.filter(s=>{
    if(s.zone==="hall") return parseInt(s.id.slice(1))<S.hallShelves;
    return S.depts.includes(s.zone);
  });
}
function shelfData(id){
  if(!S.shelves[id]) S.shelves[id]={parts:[]};
  const d=S.shelves[id];
  if(!d.parts) S.shelves[id]={parts:[{prod:d.prod||null,units:d.units||0}]};
  const dd=S.shelves[id];
  if(!dd.lvl) dd.lvl=1;
  while(dd.parts.length<S.shelfTier) dd.parts.push({prod:null,units:0});
  return dd;
}
function shelfHasStock(id){ return shelfData(id).parts.some(pt=>pt.prod&&pt.units>0); }
const SHELF_CAPS=[10,20,30,40,50];
const SHELF_UP=[50,120,240,420];
function shelfCap(id){ return SHELF_CAPS[(shelfData(id).lvl||1)-1]; }

function stockedSlotFor(prodId){
  let best=null;
  activeSlots().forEach(s=>{
    shelfData(s.id).parts.forEach((pt,pi)=>{
      if(pt.prod===prodId && pt.units>0 && (!best || pt.units>best.units)) best={slot:s, pi, units:pt.units};
    });
  });
  return best;
}
function pickList(){
  const avail=S.assortment.filter(id=>stockedSlotFor(id));
  if(!avail.length) return [];
  const n=1+Math.floor(Math.random()*3);
  const list=[];
  for(let i=0;i<n;i++){
    let tot=0; avail.forEach(id=>tot+=popOf(P[id]));
    let r=Math.random()*tot;
    for(const id of avail){ r-=popOf(P[id]); if(r<=0){ list.push(id); break; } }
  }
  return list;
}
function toAisle(c){
  const h=LY.hall, pts=[];
  if(c.y<h.y){ // im Hinterraum
    pts.push({x:c.x,y:LY.back.corrY},{x:LY.aisleX,y:LY.back.corrY},{x:LY.aisleX,y:h.y+56});
  }else if(c.x<h.x && LY.left){
    pts.push({x:LY.left.corrX,y:c.y},{x:LY.left.corrX,y:LY.left.doorY},{x:LY.aisleX,y:LY.left.doorY});
  }else if(c.x>h.x+h.w && LY.right){
    pts.push({x:LY.right.corrX,y:c.y},{x:LY.right.corrX,y:LY.right.doorY},{x:LY.aisleX,y:LY.right.doorY});
  }else{
    pts.push({x:LY.aisleX,y:Math.min(Math.max(c.y,h.y+56),h.y+h.h-40)});
  }
  return pts;
}
const CAR_COLS=["#d9534f","#4a7fb5","#e8a13a","#5aa060","#8a63b8","#e8e5de","#39444d","#c96b9c","#4aa8a0","#c9a24a"];
function freeSpace(){
  const used=new Set(cars.map(cc=>cc.space));
  for(let i=0;i<Math.min(S.parking,LY.spaces.length);i++) if(!used.has(i)) return i;
  return -1;
}
function mkCustomer(x,y){
  const list=pickList();
  return {
    x, y, path:[], list, carry:[], browser:list.length===0,
    state:"enter", timer:0, wait:0,
    skin:SKINS[Math.random()*SKINS.length|0],
    shirt:SHIRTS[Math.random()*SHIRTS.length|0],
    hair:HAIRS[Math.random()*HAIRS.length|0],
    po:Math.random()*6.28,
    speed:55+Math.random()*25,
    q:null, angry:false, thief:false,

}

const METER_FEE=[0,0.5,1.0,1.5];

function leaveShop(c){
  c.state="leave";
  if(c.car){
    const pos=LY.spaces[c.car.space];
    c.path=toAisle(c).concat([
      {x:LY.aisleX, y:LY.door.y-20},
      {x:LY.door.x, y:LY.plazaTop+54},

      {x:LY.door.x, y:LY.parkTop+12},
      {x:pos.x, y:LY.parkTop+12},
      {x:pos.x, y:pos.y-6},
    ]);

  }
  const ex=Math.random()<0.5? -24 : LY.worldW+24;
  c.path=toAisle(c).concat([
    {x:LY.aisleX, y:LY.door.y-20},
    {x:LY.door.x, y:LY.plazaTop+54},
    {x:ex<0? LY.door.x-70 : LY.door.x+70, y:LY.plazaTop+92},
    {x:ex, y:LY.roadY-14},
  ]);
}
function spawnPasser(){
  const fromL=Math.random()<0.5;
  const y=LY.plazaTop+56+Math.random()*48;
  customers.push({
    x:fromL? -18 : LY.worldW+18, y,

function nextGoal(c){
  while(c.list.length){
    const id=c.list.shift();
    const hit=stockedSlotFor(id);
    if(hit){
      c.path=toAisle(c).concat(hit.slot.route);
      c.targetSlot=hit.slot.id; c.targetPart=hit.pi; c.targetProd=id; c.state="walk";
      return;
    }
  }
  if(c.browser){ // nur umgeschaut
    c.angry=true; S.dayLog.angry++;
    effects.push({x:c.x,y:c.y-26,txt:"nichts gefunden 💨",t:1.4,col:"#d33a2f"});
    leaveShop(c); return;
  }
  if(!c.carry.length){ leaveShop(c); return; }
  goCheckout(c);
}
function goCheckout(c){
  const options=[];
  for(let i=0;i<S.kassen;i++) options.push({type:"kasse",i,len:queues.kasse[i].length});
  if(S.selfscans>0){
    const free=LY.scanPods.slice(0,S.selfscans).filter(p=>!p.busy).length;
    options.push({type:"scan", i:0, len: scanLine.length*0.5 + (free? 0 : 1.2)});
  }
  options.sort((a,b)=>a.len-b.len);
  const q=options[0];
  c.q=q; c.state="queue"; c.wait=0; c.scanT=0;
  if(q.type==="kasse") queues.kasse[q.i].push(c); else scanLine.push(c);
  updateQueuePos(c,true);
}
function updateQueuePos(c,first){
  if(!c.q) return;
  let arr, anchor;
  if(c.q.type==="kasse"){
    arr=queues.kasse[c.q.i];
    const p=LY.kassePos[c.q.i];
    anchor={x:p.x, y:p.y+36};
  }else{
    arr=scanLine;
    anchor={x:LY.scanAnchor.x, y:LY.scanAnchor.y};
  }
  const idx=arr.indexOf(c);
  const tgt = c.q.type==="kasse"
    ? {x:anchor.x, y:anchor.y+idx*24}
    : {x:anchor.x-idx*22, y:anchor.y};
  if(first) c.path=toAisle(c).concat([{x:LY.aisleX, y:c.q.type==="kasse"? anchor.y+36 : anchor.y}, tgt]);
  else c.path=[tgt];
}
function removeFromQueue(c){
  if(c.pod!=null){
    const p=LY.scanPods[c.pod];
    if(p && p.busy===c) p.busy=null;
    c.pod=null;
  }
  if(!c.q) return;
  const arr = c.q.type==="kasse" ? queues.kasse[c.q.i] : scanLine;
  const idx=arr.indexOf(c);
  if(idx>=0) arr.splice(idx,1);
  arr.forEach(x=>updateQueuePos(x,false));
  c.q=null;
}
function checkout(c,isScan){
  let sum=0;
  c.carry.forEach(it=>{ sum+=vkEff(it.prod)*it.qty; });
  if(isScan && Math.random()<theftChance()){
    c.thief=true; c.stolen=sum;
    c.speed*=1.4;
    S.dayLog.theft+=sum; S.dayLog.thefts++;
    effects.push({x:c.x,y:c.y-26,txt:"😱 DIEB! Antippen!",t:2,col:"#d33a2f"});
  }else{
    S.money+=sum; S.dayLog.rev+=sum; S.lifetime.rev+=sum;
    c.carry.forEach(it=>{ S.stats[it.prod].today+=it.qty; S.stats[it.prod].total+=it.qty; S.dayLog.sold+=it.qty; });
    effects.push({x:c.x,y:c.y-26,txt:"+"+fmt(sum),t:1.4,col:"#1f8a4d"});
  }
  removeFromQueue(c);
  leaveShop(c);
}
function catchThief(c, by){
  if(!c.thief) return;
  const sum=c.stolen||0;
  S.money+=sum;
  S.dayLog.theft=Math.max(0, S.dayLog.theft-sum);
  S.dayLog.caught++;
  c.thief=false; c.stolen=0;
  if(by==="guard" && S.office){
    GUARD.busy=true; GUARD.state="escort"; GUARD.target=c;
    removeFromQueue(c);
    c.state="escort"; c.speed=48; c.path=[
      {x:LY.office.x-40, y:LY.office.y+62},
      {x:LY.office.x+28, y:LY.office.y+62},
      {x:LY.office.x+LY.office.w/2, y:LY.office.y+LY.office.h/2},
    ];
    effects.push({x:c.x,y:c.y-26,txt:"🚔 Erwischt!",t:1.6,col:"#1f8a4d"});
    return;
  }
  let bonus=0;
  if(S.office){ bonus=100; S.money+=100; S.dayLog.fines+=100; }
  effects.push({x:c.x,y:c.y-26,txt:"🚔 Erwischt! +"+fmtS(sum+bonus),t:1.8,col:"#1f8a4d"});
  c.speed=60; c.angry=false;
  if(GUARD.state==="chase"){ GUARD.state="return"; GUARD.target=null; }
  leaveShop(c);
}
function customerGivesUp(c){
  c.carry.forEach(it=>{
    const pt=shelfData(it.slot).parts[it.pi];
    if(pt && pt.prod===it.prod) pt.units=Math.min(shelfCap(it.slot), pt.units+it.qty);
  });
  c.carry=[]; c.angry=true; S.dayLog.angry++;
  removeFromQueue(c);
  effects.push({x:c.x,y:c.y-26,txt:"😤",t:1.4,col:"#d33a2f"});
  leaveShop(c);
}
function updateCustomers(dt){
  for(let i=customers.length-1;i>=0;i--){
    const c=customers[i];
    if(c.path.length){
      const g=c.path[0];
      const dx=g.x-c.x, dy=g.y-c.y, d=Math.hypot(dx,dy);
      const step=c.speed*dt;
      if(d<=step){ c.x=g.x; c.y=g.y; c.path.shift(); }
      else{ c.x+=dx/d*step; c.y+=dy/d*step; }
    }
    switch(c.state){
      case "enter": if(!c.path.length) c.state="shop"; break;
      case "shop": nextGoal(c); break;
      case "walk": if(!c.path.length){ c.state="take"; c.timer=0.9; } break;
      case "take":
        c.timer-=dt;
        if(c.timer<=0){
          const pt=shelfData(c.targetSlot).parts[c.targetPart];
          if(pt && pt.prod===c.targetProd && pt.units>0){
            let qty=Math.min(pt.units, 1+Math.floor(Math.random()*2));
            if(isPromo(c.targetProd) || (isLiq(c.targetProd)&&S.liqPct>=0.5)) qty=Math.min(pt.units, qty*2);
            pt.units-=qty;
            c.carry.push({prod:c.targetProd, qty, slot:c.targetSlot, pi:c.targetPart});
          }
          nextGoal(c);
        }
        break;
      case "queue":{
        const arr=(c.q.type==="kasse"?queues.kasse[c.q.i]:scanLine);
        const first=arr[0]===c && !c.path.length;
        c.wait+=dt;
        if(c.wait>30 && !first) customerGivesUp(c);
        else if(c.wait>45) customerGivesUp(c);
        break;
      }
      case "topod":
        if(!c.path.length) c.state="scanning";
        break;
      case "scanning":
        c.scanT+=dt;
        if(c.scanT>=scanTime()) checkout(c,true);
        break;
      case "pass":
        if(!c.path.length){ customers.splice(i,1); break; }
        if(!c.noted && Math.abs(c.x-LY.door.x)<36){
          c.noted=true;
          effects.push({x:c.x,y:c.y-26,txt:"🤢 schmutzig hier!",t:1.5,col:"#d33a2f"});
        }
        break;
      case "leave":
        if(!c.path.length){
          if(c.car){ c.car.state="out"; c.car.cust=null; }
          customers.splice(i,1);
        }
        break;
      case "escort":
        if(!c.path.length){
          c.state="anzeige"; c.timer=4.5;
          effects.push({x:LY.office.x+LY.office.w/2, y:LY.office.y-14, txt:"📝 Anzeige...", t:2, col:"#41507a"});
        }
        break;
      case "anzeige":
        c.timer-=dt;
        if(c.timer<=0){
          S.money+=100; S.dayLog.fines+=100;
          effects.push({x:LY.office.x+LY.office.w/2, y:LY.office.y+10, txt:"+CHF 100 Busse", t:1.8, col:"#1f8a4d"});
          c.thief=false; c.speed=60;
          GUARD.busy=false; GUARD.state="return"; GUARD.target=null;
          leaveShop(c);
        }
        break;
    }
  }
}

/* ================= TAGESABLAUF ================= */
function attractInterval(){
  const stocked=activeSlots().filter(s=>shelfHasStock(s.id)).length;
  let iv=5.2/(0.55 + stocked*0.16 + S.depts.length*0.12 + S.level*0.28);
  if(S.billboard) iv/=1.35;
  iv*= 1 + odirt.length*0.06;
  const cl=cleanPct();
  iv*= cl>70?0.92: cl>40?1.2:1.75;
  iv/=trafficMult();
  if(stocked===0) iv*=2.4;   // nur noch Schaufenster-Kundschaft
  return Math.max(1.1, Math.min(14, iv));
}
function tick(dt){
  if(paused) return;
  S.t+=dt;
  const h=dayHour();
  // Mittags-Warnung & Rush
  if(!R.lunch && h>=11 && h<12){
    R.lunch=true;
    toast("🍽️ Bald ist Mittag – Regale auffüllen!", true);
  }
  if(!R.rush && h>=11.9 && h<13.5){
    R.rush=true;
    toast("🔥 Mittagsrush – jetzt läuft's!");
  }
  // Kundenspawn (Kurve über den Tag)
  R.spawn-=dt;
  if(!dayEnding && R.spawn<=0){
    const passP=Math.min(0.8, odirt.length*0.12);
    if(odirt.length && Math.random()<passP) spawnPasser();
    else spawnCustomer();
    R.spawn=attractInterval()*(0.7+Math.random()*0.6);
  }
  // Self-Scan: vorderste Person geht zum freien Automaten
  if(scanLine.length){
    const c0=scanLine[0];
    if(!c0.path.length){
      const pi=LY.scanPods.slice(0,S.selfscans).findIndex(p=>!p.busy);
      if(pi>=0){
        const p=LY.scanPods[pi];
        p.busy=c0; c0.pod=pi;
        scanLine.shift();
        scanLine.forEach(x=>updateQueuePos(x,false));
        c0.q=null; c0.state="topod"; c0.scanT=0;
        c0.path=[{x:p.x, y:p.y+30}];
      }
    }
  }
  // Dreck innen
  R.dirtT-=dt;
  if(R.dirtT<=0){
    R.dirtT=16+Math.random()*14;
    if(dirt.length<14){
      const sCount=dirt.filter(d=>d.y<LY.gang.y+LY.gang.h).length;
      if(Math.random()<0.30 && sCount<5){
        const rooms=[LY.staffR, LY.staffR, LY.lager, LY.gang, LY.ruhe, LY.tech];
        const rm=rooms[Math.random()*rooms.length|0];
        dirt.push({x:rm.x+16+Math.random()*Math.max(20,rm.w-32),
                   y:rm.y+18+Math.random()*Math.max(16,rm.h-30), r:6+Math.random()*5});
      }else{
        const hl=LY.hall;
        dirt.push({x:hl.x+50+Math.random()*(hl.w-100), y:hl.y+96+Math.random()*(hl.h-200), r:7+Math.random()*5});
      }
    }
  }
  // Abfall draussen
  R.odirtT-=dt;
  if(R.odirtT<=0){
    R.odirtT=20+Math.random()*18;
    if(odirt.length<8){
      const ems=["🍂","🥤","📄","🍌"];
      odirt.push({x:30+Math.random()*(LY.worldW-60), y:LY.plazaTop+26+Math.random()*76, em:ems[Math.random()*4|0]});
    }
  }
  // Bus
  if(S.busstop){
    if(!BUS.active){
      R.bus-=dt;
      if(R.bus<=0){ BUS.active=true; BUS.x=-100; BUS.state="in"; BUS.dropped=false; }
    }else if(BUS.state==="in"){
      BUS.x+=130*dt;
      if(BUS.x>=LY.busStop.x-42){ BUS.state="stop"; BUS.t=2.6; }
    }else if(BUS.state==="stop"){
      BUS.t-=dt;
      if(!BUS.dropped && BUS.t<2.1){
        BUS.dropped=true;
        if(!dayEnding){
          const n=3+Math.floor(Math.random()*3);
          for(let k=0;k<n;k++) spawnCustomer(LY.busStop.x+6+k*8);
          effects.push({x:LY.busStop.x+30,y:LY.busStop.y-32,txt:"🚌 +Kundschaft!",t:1.8,col:"#1f8a4d"});
        }
      }
      if(BUS.t<=0) BUS.state="out";
    }else{
      BUS.x+=150*dt;
      if(BUS.x>LY.worldW+60){ BUS.active=false; R.bus=70+Math.random()*50; }
    }
  }
  // Wachmann: Diebe jagen & ins Büro bringen
  if(!GUARD.init && LY){ GUARD.x=LY.scanAnchor.x+18; GUARD.y=LY.scanAnchor.y; GUARD.init=true; }
  if(staffOn("sicherheit")>0){
    if(GUARD.state==="post"){
      const thief=customers.find(cc=>cc.thief && cc.state==="leave");
      if(thief){ GUARD.state="chase"; GUARD.target=thief; }
    }
    if(GUARD.state==="chase"){
      const t=GUARD.target;
      if(!t || !t.thief || !customers.includes(t)){ GUARD.state="return"; GUARD.target=null; }
      else{
        const dx=t.x-GUARD.x, dy=t.y-GUARD.y, d=Math.hypot(dx,dy);
        const sp=128*dt;
        if(d<14){ catchThief(t,"guard"); if(GUARD.state==="chase"){GUARD.state="return";GUARD.target=null;} }
        else{ GUARD.x+=dx/d*sp; GUARD.y+=dy/d*sp; }
      }
    }
    if(GUARD.state==="escort"){
      const t=GUARD.target;
      if(!t || !customers.includes(t)){ GUARD.busy=false; GUARD.state="return"; GUARD.target=null; }
      else{ GUARD.x=t.x+16; GUARD.y=t.y+4; if(t.state==="leave"){ GUARD.busy=false; GUARD.state="return"; GUARD.target=null; } }
    }
    if(GUARD.state==="return"){
      const hx=LY.scanAnchor.x+18, hy=LY.scanAnchor.y;
      const dx=hx-GUARD.x, dy=hy-GUARD.y, d=Math.hypot(dx,dy);
      if(d<4) GUARD.state="post";
      else{ const sp=100*dt; GUARD.x+=dx/d*sp; GUARD.y+=dy/d*sp; }
    }
  }else{ GUARD.state="post"; GUARD.busy=false; GUARD.target=null; }
  // Autos bewegen
  for(let i=cars.length-1;i>=0;i--){
    const car=cars[i];
    if(car.state==="thru"){ car.x+=170*dt; if(car.x>LY.worldW+320) cars.splice(i,1); }
    else if(car.state==="in"){
      if(Math.abs(car.x-car.tx)>4){ car.x+=Math.sign(car.tx-car.x)*150*dt; }
      else{ car.x=car.tx; car.state="parked"; spawnFromCar(car); }
    }
    else if(car.state==="out"){ car.x+=150*dt; if(car.x>LY.worldW+320) cars.splice(i,1); }
  }
  // Team-Wohlbefinden
  {
    if(R.quitCd===undefined) R.quitCd=0;
    if(!R.reqs) planBreakReqs();
    const anyStaff=Object.values(S.staff).some(v=>v>0);
    if(anyStaff){
      const sDirtM=dirt.filter(d2=>d2.y<LY.gang.y+LY.gang.h).length;
      const drain=dt*(100/2400)*(S.staffRoom<30?1.8:1) + dt*sDirtM*(100/5200);
      let regen=0;
      if(S.staffRoomLvl>=2) regen+=dt*(100/9000)*(S.staffRoomLvl-1);
      let sum=0, cnt=0, worst=null;
      Object.keys(S.staff).forEach(k=>{
        const a=moodArr(k);
        for(let i=0;i<a.length;i++){
          const pers=0.88+((i*7+k.length)%5)*0.07;              // jede:r tickt etwas anders
          let m=a[i]-drain*pers+regen;
          if(S.staffRoomLvl>=4 && empAway(k,i)) m+=dt*(100/900); // Schlaf/Erholung während Pause
          a[i]=Math.max(0,Math.min(100,m));
          sum+=a[i]; cnt++;
          if(a[i]<15 && (!worst||a[i]<worst.m)) worst={k,i,m:a[i]};
        }
      });
      S.mood=cnt? sum/cnt : 85;
      R.quitCd-=dt;
      if(worst && R.quitCd<=0 && Math.random()<dt*0.06){
        const nm=empName(worst.k,worst.i);
        S.staff[worst.k]--;
        moodArr(worst.k).splice(worst.i,1);
        if(Array.isArray(S.lunchPlan[worst.k])) S.lunchPlan[worst.k].splice(worst.i,1);
        delete S.breaks[worst.k+"_"+worst.i];
        toast(`😡 ${nm} (${STAFF[worst.k].name}) hat gekündigt! Stell im Personal-Tab neu ein.`, true);
        R.quitCd=90;
        if(currentPanel==="personal") renderPanel();
      }
    }
    // 30-Min-Pausen-Anfragen auslösen
    const hNow2=dayHour();
    (R.reqs||[]).forEach(rq=>{
      if(!rq.fired && hNow2>=rq.at && (rq.idx||0)<(S.staff[rq.role]||0) && !empAway(rq.role,rq.idx||0)){
        rq.fired=true;
        BREQ.push({role:rq.role, idx:rq.idx||0, t:26});
        renderReqs();
      }
    });
    for(let i=BREQ.length-1;i>=0;i--){
      BREQ[i].t-=dt;
      if(BREQ[i].t<=0){
        const a=moodArr(BREQ[i].role);
        if(a[BREQ[i].idx]!==undefined) a[BREQ[i].idx]=Math.max(0,a[BREQ[i].idx]-4);
        BREQ.splice(i,1); renderReqs();
      }
    }
  }
  // Personalraum
  {
    const sDirt=dirt.filter(d=>d.y<LY.gang.y+LY.gang.h).length;
    const per=24-3*(S.staffRoomLvl-1);          // bessere Räume verkraften mehr
    S.staffRoom=Math.max(0, 100 - sDirt*per);
  }
  // Personal
  const eff=staffEff();
  const kOn=staffOn("kassierer");
  if(kOn>0){
    R.staffKasse-=dt;
    if(R.staffKasse<=0){
      R.staffKasse=kasseRate()/(kOn*eff);
      for(let i=0;i<S.kassen;i++){
        const q=queues.kasse[i];
        if(q.length && !q[0].path.length){ checkout(q[0],false); break; }
      }
    }
  }
  const fOn=staffOn("auffueller");
  if(fOn>0){
    R.staffFill-=dt;
    if(R.staffFill<=0){
      R.staffFill=4/(fOn*eff);
      let best=null;
      activeSlots().forEach(s=>{
        const cap=shelfCap(s.id);
        shelfData(s.id).parts.forEach((pt,pi)=>{
          if(pt.prod && pt.units<cap && (S.lager[pt.prod]||0)>0){
            if(!best || pt.units/cap < best.frac) best={s,pt,pi,cap,frac:pt.units/cap};
          }
        });
      });
      if(best){
        const n=Math.min(3, best.cap-best.pt.units, S.lager[best.pt.prod]);
        best.pt.units+=n; S.lager[best.pt.prod]-=n;
      }
    }
  }
  const pOn=staffOn("putz");
  if(pOn>0){
    R.staffPutz-=dt;
    if(R.staffPutz<=0){
      R.staffPutz=7/(pOn*eff);
      if(dirt.length) dirt.shift();
      else if(odirt.length) odirt.shift();
    }
  }
  updateCustomers(dt);
  for(let i=effects.length-1;i>=0;i--){ effects[i].t-=dt; effects[i].y-=12*dt; if(effects[i].t<=0) effects.splice(i,1); }
  // 100% erreicht?
  if(!S.moveOffered && S.level<4 && completion()>=1){
    S.moveOffered=true; save();
    offerMove();
  }
  // Tagesende
  if(S.t>=dayLen() && !dayEnding){
    dayEnding=true;
    customers.forEach(c=>{ if(c.state==="enter"||c.state==="shop"||c.state==="walk"||c.state==="take") c.list=[]; });
  }
  if(dayEnding && customers.length===0) endDay();
  R.autoSave-=dt;
  if(R.autoSave<=0){ R.autoSave=8; save(); }
}
function endDay(){
  paused=true; dayEnding=false;
  const wages=wagesPerDay();
  const ads=S.billboard?20:0;
  S.money-=wages+ads;
  const L=S.dayLog;
  const profit=L.rev-wages-ads-L.buys-L.inv;
  S.revHist.push(L.rev); if(S.revHist.length>7) S.revHist.shift();
  let best=null, flop=null;
  S.assortment.forEach(id=>{
    const st=S.stats[id];
    if(!best || st.today>S.stats[best].today) best=id;
    if(!flop || st.today<S.stats[flop].today) flop=id;
  });
  const hrs=(S.closeH-S.openH);
  showDialog(`
    <h2>📊 Tagesbericht – Tag ${S.day}</h2>
    <div class="sub">${LV().name} · ${SEASON_EMOJI[season()]} ${season()} · ${String(S.openH).padStart(2,"0")}–${String(S.closeH).padStart(2,"0")} Uhr · ${L.sold} Artikel${L.angry?` · ${L.angry}× genervt`:""}</div>
    <div class="stat"><span>Umsatz</span><b class="plus">+${fmtS(L.rev)}</b></div>
    <div class="stat"><span>Diebstahl (${L.thefts}×)</span><b class="minus">−${fmtS(L.theft)}</b></div>
    ${L.caught?`<div class="stat"><span>🚔 Diebe gefasst (${L.caught}×) · Bussen</span><b class="plus">+${fmtS(L.fines)}</b></div>`:""}
    ${L.pfees>0?`<div class="stat"><span>🅿️ Parkgebühren</span><b class="plus">+${fmt(L.pfees)}</b></div>`:""}
    <div class="stat"><span>Wareneinkauf</span><b class="minus">−${fmtS(L.buys)}</b></div>
    <div class="stat"><span>Löhne (${hrs}h${hoursFactor()>1.01?" inkl. Zuschlag":""})</span><b class="minus">−${fmtS(wages)}</b></div>
    ${ads?`<div class="stat"><span>Werbetafel</span><b class="minus">−${fmtS(ads)}</b></div>`:""}
    ${L.inv?`<div class="stat"><span>Rechnungen bezahlt</span><b class="minus">−${fmtS(L.inv)}</b></div>`:""}
    ${S.invoices.length?`<div class="stat"><span>📄 Offene Rechnungen</span><b class="${worstOverdue()?'minus':''}">${fmtS(invoiceTotal())}${worstOverdue()?" · MAHNUNG!":""}</b></div>`:""}
    <div class="stat total"><span>Tagesgewinn</span><b class="${profit>=0?'plus':'minus'}">${profit>=0?"+":"−"}${fmtS(Math.abs(profit))}</b></div>
    ${best?`<div class="stat"><span>🏆 Bestseller</span><b>${P[best].emoji} ${P[best].name} (${S.stats[best].today}×)</b></div>`:""}
    ${flop?`<div class="stat"><span>🐌 Ladenhüter</span><b>${P[flop].emoji} ${P[flop].name} (${S.stats[flop].today}×)</b></div>`:""}
    <button class="btn" onclick="showPlanner()">Weiter zur Tagesplanung ▶</button>
  `);
  S.assortment.forEach(id=>{ S.stats[id].yesterday=S.stats[id].today; S.stats[id].today=0; });
  S.day++; S.t=0; S.lifetime.days++;
  S.dayLog={rev:0,theft:0,thefts:0,buys:0,sold:0,angry:0,inv:0,caught:0,fines:0,pfees:0};
  dirt=dirt.slice(0,Math.floor(dirt.length/2));
  odirt=odirt.slice(0,Math.floor(odirt.length/2));
  save();
}

function planBreakReqs(){

/* ================= OFFLINE-FORTSCHRITT ================= */
function offlineSim(){
  const elapsed=Math.min(OFFLINE_CAP,(Date.now()-S.lastSave)/1000);
  if(elapsed<120) return;
  const canSell=S.staff.kassierer>0 || S.selfscans>0;
  if(!canSell) return;
  let shelfUnits=0;
  activeSlots().forEach(s=>{ shelfData(s.id).parts.forEach(pt=>shelfUnits+=pt.units); });
  let lagerUnits=0;
  if(S.staff.auffueller>0) Object.keys(S.lager).forEach(k=>lagerUnits+=S.lager[k]);
  const avail=shelfUnits+lagerUnits;
  if(avail<=0) return;
  const speed=S.staff.kassierer>0?1:0.7;
  let sold=Math.min(avail, Math.floor(elapsed/5*0.3*speed*1.8));
  if(sold<=0) return;
  let vkSum=0,n=0;
  activeSlots().forEach(s=>{ shelfData(s.id).parts.forEach(pt=>{ if(pt.prod){ vkSum+=vkEff(pt.prod); n++; } }); });
  const avgVK=n? vkSum/n : 2;
  let toSell=sold;
  activeSlots().forEach(s=>{
    shelfData(s.id).parts.forEach(pt=>{
      const take=Math.min(pt.units, Math.ceil(toSell*(pt.units/Math.max(1,shelfUnits))));
      pt.units-=take; toSell-=take;
    });
  });
  if(toSell>0 && S.staff.auffueller>0){
    for(const k of Object.keys(S.lager)){
      const take=Math.min(S.lager[k],toSell);
      S.lager[k]-=take; toSell-=take;
      if(!toSell) break;
    }
  }
  sold-=Math.max(0,toSell);
  let rev=sold*avgVK, theft=0;
  if(S.staff.kassierer===0){ theft=rev*theftChance(); rev-=theft; }
  const dayFrac=elapsed/dayLen();

const SPRC=new Map();

function cachedPJ(key,bx,by,bw,bh,drawFn){
  key=key+"|t"+SPR_TIER;

    if(SPRC.size>360) SPRC.clear();
    c=mkCanvas(Math.max(2,Math.ceil(bw*SPR_TIER)), Math.max(2,Math.ceil(bh*SPR_TIER)));

    c._b=[bx,by,bw,bh];

}

const IX=0.82, IY=0.46, WALLH=30;

function UNPJ(sx,sy){ const a=sx/IX, b=sy/IY; return {x:(b+a)/2, y:(b-a)/2}; }
function isoBounds(){
  const W=LY.worldW, H=LY.worldH;
  return {minx:PJ(-40,H+40).x, maxx:PJ(W+40,-40).x,
          miny:PJ(-40,-40).y-WALLH-40, maxy:PJ(W+60,H+60).y+30};
}

  const B=isoBounds();

  cam.y = (B.maxy-B.miny)<=vh ? B.miny-(vh-(B.maxy-B.miny))/2 : Math.max(B.miny, Math.min(B.maxy-vh, cam.y));

const SHADE_C=new Map();
function shade(hex,f){
  if(typeof hex!=="string" || hex[0]!=="#") return typeof hex==="string"? hex : "#888";
  const key=hex+"|"+f;
  let v=SHADE_C.get(key);
  if(v) return v;
  const n=parseInt(hex.slice(1),16);
  const r=Math.min(255,Math.round(((n>>16)&255)*f)),
        g=Math.min(255,Math.round(((n>>8)&255)*f)),
        b=Math.min(255,Math.round((n&255)*f));
  v=`rgb(${r},${g},${b})`;
  SHADE_C.set(key,v);
  return v;
}

        w=BW[key]={x:wp.x, y:wp.y, ph:"go", seat:seat, kind};
        w.legs=buildGoLegs(wp,w); w.li=0;
      }
      if(!w){ if(away) seat++; continue; }
      if(away) seat++;
      // Richtungswechsel sauber behandeln
      if(!away && (w.ph==="go"||w.ph==="sit")){ w.ph="back"; w.legs=buildBackLegs(w,k,i); w.li=0; }
      else if(away && w.ph==="back"){ w.ph="go"; w.legs=buildGoLegs(w,w); w.li=0; }
      let moving=false, gone=false;
      if(w.ph!=="sit"){
        const t=w.legs[w.li];
        if(moveVis(w,t.x,t.y,54,dtv)){
          w.li++;
          if(w.li>=w.legs.length){
            if(w.ph==="go") w.ph="sit";
            else{ delete BW[key]; gone=true; }
          }else moving=true;
        }else moving=true;
      }
      if(gone) continue;
      const lk=STAFF_LOOK[k];
      drawPerson(w.x,w.y,lk[0],lk[1],lk[2],{phase:moving?now*9+i:undefined, look:i%4});
      if(w.ph==="sit"){
        const sp=seatPos(w.kind,w.seat);
        BB(w.x,w.y,()=>{ drawEm(sp.badge, 10, 10, -16); });
      }
    }
  });
}

        if(pt.prod && pt.units<cap && (S.lager[pt.prod]||0)>0 && pt.units/cap<worst){
          worst=pt.units/cap; bestS=s;

    });
    const home={x:LY.lager.x+LY.lager.w/2, y:LY.lager.y+LY.lager.h+16};

      if(VIS.auff.carry){ moving=!moveVis(VIS.auff,bestS.appr.x,bestS.appr.y,50,dtv); if(!moving) VIS.auff.carry=false; }
      else{ moving=!moveVis(VIS.auff,home.x,home.y,50,dtv); if(!moving) VIS.auff.carry=true; }

    drawPerson(VIS.auff.x,VIS.auff.y,"#d08a30","#c98a5b","#1e1e1e",{apron:"#eef1f3",phase:moving?now*9:undefined});

  }
}

const SPR={};
function rrG(g,x,y,w,h,r){ g.beginPath(); g.moveTo(x+r,y); g.arcTo(x+w,y,x+w,y+h,r); g.arcTo(x+w,y+h,x,y+h,r); g.arcTo(x,y+h,x,y,r); g.arcTo(x,y,x+w,y,r); g.closePath(); }
function vgrad(g,y,h,c1,c2){ const gr=g.createLinearGradient(0,y,0,y+h); gr.addColorStop(0,c1); gr.addColorStop(1,c2); return gr; }

  g.textAlign="center"; fn(g);
  c._w=w; c._h=h; SPR[key]=c; return c;
}

function drawRoom(rect, wallCol, flA, flB, label){

  const ix=rect.x+8, iy=rect.y+8, iw=rect.w-16, ih=rect.h-16;
  ctx.save(); rr(ix,iy,iw,ih,6); ctx.clip();

      ctx.fillStyle=(tx+ty)%2? flA : flB;

function render(){
  const now=performance.now()/1000;
  const dtv=Math.min(0.1, now-(VIS.last||now)); VIS.last=now;
  initTex();
  const _dpr=DPR();
  ctx.setTransform(sc*_dpr,0,0,sc*_dpr, -cam.x*sc*_dpr, -cam.y*sc*_dpr);
  ctx.textAlign="center";
  const WW=LY.worldW, WH=LY.worldH, T=6;
  const vwv=stW/sc, vhv=stH/sc;
  DRLIST.length=0;

  /* ===== Iso-Helfer ===== */
  function isoWorld(fn,h){ ctx.save(); if(h) ctx.translate(0,-h); ctx.transform(IX,IY,-IX,IY,0,0); fn(); ctx.restore(); }
  function faceS(x0,Y,w,h,fn){ const p=PJ(x0,Y,h); ctx.save(); ctx.transform(IX,IY,0,1,p.x,p.y); fn(w,h); ctx.restore(); }
  function faceE(X0,y0,d,h,fn){ const p=PJ(X0,y0,h); ctx.save(); ctx.transform(-IX,IY,0,1,p.x,p.y); fn(d,h); ctx.restore(); }
  const vg2=vg2glob;
  function isoBox(x,y,w,d,h,cTop,cS,cE){
    faceE(x+w,y,d,h,(W,H)=>{
      if(typeof cE==="function"){ cE(W,H); return; }
      const f = cE || (typeof cS==="string"? shade(cS,0.7) : "rgba(35,45,54,.85)");
      ctx.fillStyle=f; ctx.fillRect(0,0,W,H);
    });
    faceS(x,y+d,w,h,(W,H)=>{ if(typeof cS==="function") cS(W,H); else { ctx.fillStyle=vg2(H,shade(cS,1.05),shade(cS,0.72)); ctx.fillRect(0,0,W,H);} 
      ctx.fillStyle="rgba(0,0,0,.14)"; ctx.fillRect(0,h-2.5,W,2.5); });
    isoWorld(()=>{ ctx.fillStyle= typeof cTop==="function"? cTop(): cTop; ctx.fillRect(x,y,w,d);
      ctx.fillStyle="rgba(255,255,255,.16)"; ctx.fillRect(x,y,w,2); }, h);
  }
  function gshadow(x,y,w,d,al){ isoWorld(()=>{ ctx.fillStyle="rgba(0,0,0,"+(al||0.18)+")";
    ctx.beginPath(); ctx.ellipse(x+w/2,y+d/2,w*0.62,d*0.72,0,0,7); ctx.fill(); }); }

  const OUT="#4e5a63", WFACE= S.reno? "#95a9b6":"#8b969d";
  function paintExt(W,H,winStep){
    ctx.fillStyle=vg2(H, shade(WFACE,1.1), shade(WFACE,0.66)); ctx.fillRect(0,0,W,H);
    ctx.fillStyle="rgba(255,255,255,.25)"; ctx.fillRect(0,0,W,2.5);
    if(winStep){ for(let wx=12; wx<W-20; wx+=winStep){
      ctx.fillStyle=vg2(H,"#d7ecf5","#8fb4c6"); ctx.fillRect(wx,H*0.28,17,H*0.42);
      ctx.fillStyle="rgba(255,255,255,.5)"; ctx.fillRect(wx+3,H*0.3,4,H*0.38);
      ctx.fillStyle="rgba(0,0,0,.18)"; ctx.fillRect(wx,H*0.28+H*0.42,17,2);
    } }
  }
  function paintInt(W,H){
    ctx.fillStyle=vg2(H, shade(WFACE,1.0), shade(WFACE,0.7)); ctx.fillRect(0,0,W,H);
    ctx.fillStyle="rgba(255,255,255,.2)"; ctx.fillRect(0,0,W,2);
  }
  // Wand-Slab (horizontal: len entlang x / vertikal: len entlang y), mit Türlücken
  function wallSlabH(x,y,len,gaps,style,winStep){
    let segs=[[x,x+len]];
    (gaps||[]).forEach(g=>{ const ns=[]; segs.forEach(([a1,a2])=>{
      if(g[1]<=a1||g[0]>=a2){ns.push([a1,a2]);return;}
      if(g[0]>a1) ns.push([a1,g[0]]); if(g[1]<a2) ns.push([g[1],a2]); }); segs=ns; });
    segs.forEach(([a1,a2])=>{
      D(a1*0.5+a2*0.5+y+T, ()=>{
        const bb=bboxIso(a1,y,a2-a1,T,WALLH);
        cachedPJ("wH|"+a1+"|"+y+"|"+(a2-a1)+"|"+style+"|"+winStep+"|"+(S.reno?1:0), bb[0],bb[1],bb[2],bb[3], ()=>{
          isoBox(a1,y,a2-a1,T,WALLH, shade(OUT,1.1),
            style==="ext"? (W,H)=>paintExt(W,H,winStep) : (W,H)=>paintInt(W,H), shade(OUT,0.8));
        });
      });
    });
    (gaps||[]).forEach(g=>{ isoWorld(()=>{ ctx.fillStyle="#8a6a3a"; ctx.fillRect(g[0]+2,y,g[1]-g[0]-4,T); }); });
  }
  function wallSlabV(x,y,len,gaps,style){
    let segs=[[y,y+len]];
    (gaps||[]).forEach(g=>{ const ns=[]; segs.forEach(([a1,a2])=>{
      if(g[1]<=a1||g[0]>=a2){ns.push([a1,a2]);return;}
      if(g[0]>a1) ns.push([a1,g[0]]); if(g[1]<a2) ns.push([g[1],a2]); }); segs=ns; });
    segs.forEach(([a1,a2])=>{
      D(x+T+(a1+a2)*0.5, ()=>{
        const bb=bboxIso(x,a1,T,a2-a1,WALLH);
        cachedPJ("wV|"+x+"|"+a1+"|"+(a2-a1)+"|"+(S.reno?1:0), bb[0],bb[1],bb[2],bb[3], ()=>{
          faceE(x+T,a1,a2-a1,WALLH,(W,H)=>{ ctx.fillStyle=vg2(H, shade(WFACE,0.95), shade(WFACE,0.62)); ctx.fillRect(0,0,W,H); });
          faceS(x,a2,T,WALLH,(W,H)=>{ ctx.fillStyle=shade(OUT,0.85); ctx.fillRect(0,0,W,H); });
          isoWorld(()=>{ ctx.fillStyle=shade(OUT,1.1); ctx.fillRect(x,a1,T,a2-a1); }, WALLH);
        });
      });
    });
  }

  /* ===== BODEN-PASS (Welt-Transform) ===== */
  const EXT=WW+WH;   // Boden reicht in jeder Zoomstufe bis über den Bildrand
  isoWorld(()=>{
    ctx.fillStyle=TEX.grass; ctx.fillRect(-EXT,-EXT,WW+2*EXT,WH+2*EXT);
    ctx.fillStyle=TEX.plaza; ctx.fillRect(-EXT, LY.plazaTop, WW+2*EXT, LY.roadY-LY.plazaTop);
    ctx.fillStyle="rgba(0,0,0,.06)"; ctx.fillRect(-EXT,LY.plazaTop,WW+2*EXT,3);
    ctx.fillStyle=TEX.asphalt; ctx.fillRect(-EXT,LY.roadY,WW+2*EXT,50);
    ctx.fillStyle="rgba(0,0,0,.10)"; ctx.fillRect(-EXT,LY.roadY,WW+2*EXT,50);
    ctx.fillStyle="#b8bcc2"; ctx.fillRect(-EXT,LY.roadY-4,WW+2*EXT,4);
    ctx.strokeStyle="rgba(255,255,255,.7)"; ctx.lineWidth=2.5; ctx.setLineDash([14,12]);
    ctx.beginPath(); ctx.moveTo(-EXT,LY.roadY+25); ctx.lineTo(WW+EXT,LY.roadY+25); ctx.stroke();
    ctx.setLineDash([]);

    // Parkplatz
    ctx.fillStyle=TEX.asphalt; ctx.fillRect(-EXT,LY.parkTop,WW+2*EXT,WH-LY.parkTop+EXT);
    ctx.fillStyle="rgba(0,0,0,.05)"; ctx.fillRect(-EXT,LY.parkTop,WW+2*EXT,WH-LY.parkTop+EXT);
    ctx.fillStyle="#b8bcc2"; ctx.fillRect(-EXT,LY.parkTop-4,WW+2*EXT,4);

    const groundDetail=()=>{
    // Gebäudeböden

        ctx.beginPath(); ctx.arc(0,-6,17,0,7); ctx.stroke();
        ctx.font="10px -apple-system,sans-serif"; ctx.fillText("💨",-14,-16);

  for(let i=effects.length-1;i>=0;i--){

  /* ===== TIEFENSORTIERT ZEICHNEN ===== */
  DRLIST.sort((a,b)=>a.z-b.z);

  /* ===== LICHT & NACHT ===== */
  if(!S.eco){
    const vgd=ctx.createRadialGradient(cam.x+vwv*0.35, cam.y+vhv*0.25, 60,
                                      cam.x+vwv*0.5, cam.y+vhv*0.55, Math.max(vwv,vhv)*0.85);
    vgd.addColorStop(0,"rgba(255,250,225,.07)");
    vgd.addColorStop(0.6,"rgba(0,0,0,0)");
    vgd.addColorStop(1,"rgba(25,35,55,.13)");
    ctx.fillStyle=vgd; ctx.fillRect(cam.x-60,cam.y-60,vwv+120,vhv+120);

  const hNow=dayHour();

  if(hNow>=19 && hNow<20) dusk=(hNow-19);
  if(hNow>=20) dark=Math.min(1,(hNow-20)/1.2);

  if(dark>0){
    isoWorld(()=>{
      const bbX=LY.gang.x-10, bbX2=LY.gang.x+LY.gang.w+10;
      const bbY=LY.srY-10, bbY2=LY.hall.y+LY.hall.h+14;

      ctx.fillStyle=`rgba(10,14,42,${dark*0.55})`;
      ctx.fillRect(-E2,-E2,WW+2*E2,bbY+E2);

      ctx.fillRect(bbX2,bbY,WW+E2-bbX2,bbY2-bbY);
      ctx.fillRect(-E2,bbY2,WW+2*E2,WH+E2-bbY2);

    function glow(wx,wy,r,col){

    glow(LY.door.x, LY.hall.y+LY.hall.h+30, 70, `rgba(255,220,140,${dark*0.5})`);
    [[LY.hall.x+50],[LY.door.x],[LY.hall.x+LY.hall.w-50]].forEach(([lx])=>{
      const ly=LY.plazaTop+66;

      ctx.fillStyle="#ffd88a"; ctx.beginPath(); ctx.arc(q.x,q.y-36,4,0,7); ctx.fill();
      glow(lx,ly,55,`rgba(255,215,130,${dark*0.4})`);

    if(S.billboard) glow(LY.billboard.x, LY.billboard.y, 60, `rgba(255,200,120,${dark*0.45})`);
    if(S.busstop) glow(LY.busStop.x, LY.busStop.y, 46, `rgba(200,225,255,${dark*0.4})`);

/* ================= EINGABE (Wischen + Tippen) ================= */
const PTR={down:false, sx:0, sy:0, cx0:0, cy0:0, dragged:false, hinted:false};
const PTRS=new Map();
const PINCH={on:false, d0:0, sc0:1, aw:{x:0,y:0}};
function ptrMid(){
  const a=[...PTRS.values()];
  return {x:(a[0].x+a[1].x)/2, y:(a[0].y+a[1].y)/2,
          d:Math.hypot(a[0].x-a[1].x, a[0].y-a[1].y)};
}
function panBaseline(ev){
  PTR.sx=ev.clientX; PTR.sy=ev.clientY;
  PTR.cx0=cam.x; PTR.cy0=cam.y;
}
cv.addEventListener("pointerdown", ev=>{
  PTRS.set(ev.pointerId,{x:ev.clientX,y:ev.clientY});
  if(PTRS.size===1){
    PTR.down=true; PTR.dragged=false;
    panBaseline(ev);
  }else if(PTRS.size===2){
    const r=cv.getBoundingClientRect();
    const m=ptrMid();
    PINCH.on=true; PINCH.d0=Math.max(20,m.d); PINCH.sc0=sc;
    PINCH.aw={x:cam.x+(m.x-r.left)/sc, y:cam.y+(m.y-r.top)/sc};
    PTR.dragged=true;
    if(!PTR.hinted){ PTR.hinted=true; $("panHint").style.opacity=0; }
  }
});
cv.addEventListener("pointermove", ev=>{
  if(!PTRS.has(ev.pointerId)) return;
  PTRS.set(ev.pointerId,{x:ev.clientX,y:ev.clientY});
  if(PINCH.on && PTRS.size>=2){
    const r=cv.getBoundingClientRect();
    const m=ptrMid();
    sc=Math.max(fitScale(), Math.min(maxScale(), PINCH.sc0*m.d/PINCH.d0));
    userSc=sc; zoomFit=false; $("zoomBtn").textContent="🗺️";
    cam.x=PINCH.aw.x-(m.x-r.left)/sc;
    cam.y=PINCH.aw.y-(m.y-r.top)/sc;
    clampCam();
    return;
  }
  if(!PTR.down) return;
  const dx=ev.clientX-PTR.sx, dy=ev.clientY-PTR.sy;
  if(Math.hypot(dx,dy)>8){
    PTR.dragged=true;
    if(!PTR.hinted){ PTR.hinted=true; $("panHint").style.opacity=0; }
  }
  if(PTR.dragged){
    cam.x=PTR.cx0-dx/sc; cam.y=PTR.cy0-dy/sc;
    clampCam();
  }
});
function ptrEnd(ev){
  const wasPinch=PINCH.on;
  PTRS.delete(ev.pointerId);
  if(PTRS.size<2) PINCH.on=false;
  if(PTRS.size===1){
    const rest=[...PTRS.values()][0];
    PTR.down=true; PTR.dragged=true;
    PTR.sx=rest.x; PTR.sy=rest.y; PTR.cx0=cam.x; PTR.cy0=cam.y;
    return;
  }
  if(PTRS.size===0){
    const wasDown=PTR.down; PTR.down=false;
    if(!wasDown || PTR.dragged || wasPinch) return;
    const r=cv.getBoundingClientRect();
    const w=UNPJ((ev.clientX-r.left)/sc+cam.x, (ev.clientY-r.top)/sc+cam.y);
    handleTap(w.x, w.y);
  }
}
window.addEventListener("pointerup", ptrEnd);
window.addEventListener("pointercancel", ptrEnd);
cv.addEventListener("wheel", ev=>{
  ev.preventDefault();
  const r=cv.getBoundingClientRect();
  const mx=ev.clientX-r.left, my=ev.clientY-r.top;
  const aw={x:cam.x+mx/sc, y:cam.y+my/sc};
  sc=Math.max(fitScale(), Math.min(maxScale(), sc*(ev.deltaY<0? 1.12:0.89)));
  userSc=sc; zoomFit=false; $("zoomBtn").textContent="🗺️";
  cam.x=aw.x-mx/sc; cam.y=aw.y-my/sc;
  clampCam();
},{passive:false});
function handleTap(x,y){
  // Diebe fangen – überall, solange sie sichtbar sind!
  for(const c of customers){
    if(c.thief && Math.hypot(x-c.x, y-c.y)<28){
      catchThief(c,"player");
      return;
    }
  }
  // Parkplatz: Parkuhr & Ausbau
  if(y>LY.parkTop-6){
    if(Math.hypot(x-(LY.door.x+74), y-(LY.parkTop+16))<26){
      if(S.parkMeterTier>0) toast(`🪙 Parkuhr Stufe ${S.parkMeterTier}: ${fmt(METER_FEE[S.parkMeterTier])} pro Auto. Heute: +${fmt(S.dayLog.pfees)}`);
      else{ openPanel("ausbau"); toast("🪙 Eine Parkuhr kannst du im Ausbau kaufen!"); }
      return;
    }
    if(S.parking<LV().parkCap){ openPanel("ausbau"); toast("🅿️ Mehr Parkplätze gibt's im Ausbau!"); }
    return;
  }
  // Aussen
  if(y>LY.plazaTop-6){
    for(let i=odirt.length-1;i>=0;i--){
      const d=odirt[i];
      if(Math.hypot(x-d.x,y-d.y)<18){
        odirt.splice(i,1);
        effects.push({x:d.x,y:d.y-10,txt:"✨",t:0.9,col:"#41505c"});
        return;
      }
    }
    if(S.billboard && Math.abs(x-LY.billboard.x)<45 && Math.abs(y-LY.billboard.y)<38){
      toast("📣 Deine Werbetafel lockt Kundschaft an (20/Tag)."); return;
    }
    if(S.busstop && Math.abs(x-LY.busStop.x)<55 && Math.abs(y-LY.busStop.y)<40){
      toast("🚌 Der Bus bringt regelmässig Kundengruppen."); return;
    }
    return;
  }
  // Innen
  for(let i=dirt.length-1;i>=0;i--){
    const d=dirt[i];
    if(Math.hypot(x-d.x,y-d.y)<d.r+14){
      dirt.splice(i,1);
      effects.push({x:d.x,y:d.y-8,txt:"✨",t:0.9,col:"#41505c"});
      return;
    }
  }
  for(let i=0;i<S.kassen;i++){
    const p=LY.kassePos[i];
    if(Math.abs(x-p.x)<38 && Math.abs(y-p.y)<26){
      const q=queues.kasse[i];
      if(q.length && !q[0].path.length){ checkout(q[0],false); }
      else toast("Niemand an der Kasse.");
      return;
    }
  }
  const st=LY.staffR;
  if(x>st.x && x<st.x+st.w && y>st.y && y<st.y+st.h){
    if(S.staffRoom<95){ S.staffRoom=100; toast("☕ Personalraum geputzt – Team happy!"); }
    else toast("Der Personalraum ist schon sauber.");
    return;
  }
  const lg=LY.lager;
  if(x>lg.x && x<lg.x+lg.w && y>lg.y && y<lg.y+lg.h){ openPanel("einkauf"); return; }
  const ru=LY.ruhe;
  if(x>ru.x && x<ru.x+ru.w && y>ru.y && y<ru.y+ru.h){
    if(S.staffRoomLvl>=4) toast("💤 Ruheraum: Dein Team ist top erholt (+24% Tempo).");
    else{ openPanel("ausbau"); toast("🛏️ Der Ruheraum kommt mit Personalraum-Stufe 4."); }
    return;
  }
  const of=LY.office;
  if(x>of.x && x<of.x+of.w && y>of.y && y<of.y+of.h){
    if(S.office) toast("🚔 Diebstahlbüro: Jede Anzeige bringt CHF 100.");
    else{ openPanel("ausbau"); toast("🚔 Das Diebstahlbüro kannst du im Ausbau kaufen."); }
    return;
  }
  for(const s of activeSlots()){
    if(Math.abs(x-s.x)<50 && y>s.y-32 && y<s.y+26){ openShelf(s.id); return; }
  }
}

}

  currentPanel=null;

}

function renderPanel(){
  if(currentPanel==="einkauf") renderEinkauf();
  else if(currentPanel==="sortiment") renderSortiment();
  else if(currentPanel==="personal") renderPersonal();
  else if(currentPanel==="ausbau") renderAusbau();
  else if(currentPanel==="finanzen") renderFinanzen();

function renderFinanzen(){
  $("panelTitle").textContent="💰 Finanz-Übersicht";
  $("panelSub").textContent=`Kontostand: ${fmtS(S.money)}`;
  const avg=avgRevenue();
  const ads=S.billboard?20:0;

  html+=`<div class="stat" style="padding:7px 4px"><span>🧑‍💼 Personalkosten</span><b class="minus">−${fmtS(wagesPerDay())}</b></div>`;
  if(ads) html+=`<div class="stat" style="padding:7px 4px"><span>📣 Werbetafel</span><b class="minus">−${fmtS(ads)}</b></div>`;
  if(avg!==null){
    const net=avg-wagesPerDay()-ads;
    html+=`<div class="stat total" style="padding:7px 4px"><span>Erwarteter Überschuss</span><b class="${net>=0?'plus':'minus'}">${net>=0?"+":"−"}${fmtS(Math.abs(net))}</b></div>`;
  }
  html+=`<div class='secTitle'>Offene Rechnungen ${S.invoices.length?`<span class="tag ${worstOverdue()?'flop':''}">${fmtS(invoiceTotal())}</span>`:""}</div>`;

    html+=`<p style="font-size:13px;color:var(--ink-soft);padding:8px 4px">Keine offenen Rechnungen. 🎉 Tipp: Wenn das Geld mal nicht reicht, kannst du Ware unter «Einkauf» auf Rechnung bestellen.</p>`;
  }
  S.invoices.slice().sort((a,b)=>a.due-b.due).forEach(v=>{

    html+=`<div class="row">
      <div class="em">${overdue?"⚠️":"📄"}</div>
      <div class="info"><b>${v.desc}${v.rate?' <span class="tag">Rate</span>':''}${overdue?' <span class="tag flop">MAHNUNG</span>':''}</b>
      <small>${overdue
        ? `Überfällig! Laden wird in <b>${daysLeft} Tag${daysLeft===1?"":"en"}</b> geschlossen!`
        : `Fällig bis Tag ${v.due} (noch ${v.due-S.day} Tage)`}</small></div>
      ${(!v.rate && v.amount>=30)?`<button class="btn sec" onclick="splitInvoice(${v.id})">3 Raten</button>`:""}
      <button class="btn ${overdue?'':'green'}" onclick="payInvoice(${v.id})" ${S.money<v.amount?"disabled":""}>${fmtS(v.amount)}</button>
    </div>`;
  });
  html+=`<p style="font-size:11.5px;color:var(--ink-soft);padding:8px 4px">1 Monat = ${MONTH_DAYS} Spieltage. Rechnungen sind 1 Monat nach Erhalt fällig. Wer die Mahnfrist (1 weiterer Monat) verpasst, verliert den Laden!</p>`;
  $("panelBody").innerHTML=html;
}
window.payInvoice=function(id){
  const i=S.invoices.findIndex(v=>v.id===id);
  if(i<0) return;
  const v=S.invoices[i];
  if(S.money<v.amount){ toast("💸 Zu wenig Geld!"); return; }
  S.money-=v.amount; S.dayLog.inv+=v.amount;
  S.invoices.splice(i,1);
  toast(`✅ Rechnung bezahlt: ${fmtS(v.amount)}`);
  renderPanel(); save();
};
window.splitInvoice=function(id){
  const i=S.invoices.findIndex(v=>v.id===id);
  if(i<0) return;
  const v=S.invoices[i];
  if(v.rate) return;
  const part=Math.round((v.amount/3)*20)/20;
  const last=Math.round((v.amount-part*2)*20)/20;
  S.invoices.splice(i,1);
  for(let k=0;k<3;k++){
    S.invoices.push({id:S.invSeq++, desc:`${v.desc} (Rate ${k+1}/3)`,
      amount:k<2?part:last, due:v.due+k*MONTH_DAYS, rate:true});
  }
  toast("📄 In 3 Monatsraten aufgeteilt");
  renderPanel(); save();
};

  S.assortment.forEach(id=>{
    const p=P[id], st=S.stats[id];
    const flop=st.yesterday===0 && st.total>0 && S.day>1;
    const hit=st.yesterday>=8;
    html+=`<div class="row">
      <div class="em">${p.emoji}</div>
      <div class="info"><b>${p.name}${p.season?`<span class="tag ${p.season===season()?'season':''}">${SEASON_EMOJI[p.season]} ${p.season}</span>`:""}${flop?'<span class="tag flop">Ladenhüter</span>':hit?'<span class="tag hit">läuft!</span>':""}</b>

    </div>`;
    const lvl=prodLvl(id);
    html+=`<div class="row" style="padding-top:2px">
      <div class="em" style="font-size:15px">${lvl>=3?"⭐":"💲"}</div>
      <div class="info" style="display:flex;align-items:center;gap:8px;flex-wrap:wrap">
        <b style="font-size:13px">${fmt(vkOf(id))}</b>
        <span class="tag ${lvl>1?"season":""}" title="Qualität">${"★".repeat(lvl)}${"☆".repeat(3-lvl)}</span>
        ${lvl<3
          ? `<button class="btn" style="padding:6px 10px" onclick="upgradeProd('${id}')">⭐ Qualität ${fmtS(cost(lvl===1?40:100))}</button>`
          : '<span class="tag hit">Premium</span>'}
        ${isPromo(id)
          ? '<span class="tag hit">🔥 AKTION heute</span>'
          : `<button class="btn sec" style="padding:6px 10px" onclick="setPromo('${id}')">🔥 Aktion ${fmtS(cost(30))}</button>`}
      </div>
    </div>`;
  });
  Object.keys(DEPTS).forEach(dk=>{
    const avail=PRODUCTS.filter(p=>p.dept===dk && !S.assortment.includes(p.id));
    if(!avail.length) return;
    const deptOk=S.depts.includes(dk);
    avail.sort((a,b)=> (prodUnlocked(a)?0:1)-(prodUnlocked(b)?0:1) || (a.lv||1)-(b.lv||1));
    html+=`<div class='secTitle'>${DEPTS[dk].emoji} ${DEPTS[dk].name} ${deptOk?"":"🔒 (Abteilung nicht gebaut)"}</div>`;
    avail.forEach(p=>{
      const lvOk=prodUnlocked(p);
      const unlocked=deptOk && lvOk;
      html+=`<div class="row" style="${unlocked?"":"opacity:.45"}">
        <div class="em">${p.emoji}</div>
        <div class="info"><b>${p.name}${p.season?`<span class="tag ${p.season===season()?'season':''}">${SEASON_EMOJI[p.season]} ${p.season}</span>`:""}${lvOk?"":`<span class="tag">🔒 ab Level ${p.lv}</span>`}</b>
        <small>EK ${fmt(p.ek)} → VK ${fmt(p.vk)}</small></div>
        ${unlocked
          ? `<button class="btn green" onclick="addProduct('${p.id}')">Aufnehmen</button>`
          : `<span class="tag">🔒</span>`}
      </div>`;
    });
  });
  $("panelBody").innerHTML=html;
}
window.addProduct=function(id){
  if(!S.assortment.includes(id)) S.assortment.push(id);
  ensureStats();
  toast(`✅ ${P[id].name} ist neu im Sortiment`);
  renderPanel(); save();
};
window.upgradeProd=function(id){
  const lvl=prodLvl(id);
  if(lvl>=3) return;
  if(!pay(cost(lvl===1?40:100))) return;
  S.prodLvl[id]=lvl+1;
  toast(`⭐ ${P[id].name}: Qualität ${"★".repeat(lvl+1)}${"☆".repeat(2-lvl)} – Kunden zahlen jetzt ${fmt(vkOf(id))}!`, true);
  renderPanel(); save();
};
window.setPromo=function(id){
  if(!pay(cost(30))) return;
  S.promoId=id; S.promoDay=S.day;
  toast(`🔥 AKTION heute: ${P[id].emoji} ${P[id].name} – Kunden kaufen doppelt!`, true);
  renderPanel(); save();
};
window.dropProduct=function(id){
  S.assortment=S.assortment.filter(x=>x!==id);
  delete S.lager[id];
  delete S.prodLvl[id];
  if(S.promoId===id) S.promoId=null;
  Object.keys(S.shelves).forEach(k=>{
    (S.shelves[k].parts||[]).forEach(pt=>{
      if(pt.prod===id){ pt.prod=null; pt.units=0; }
    });
  });
  toast(`🗑️ ${P[id].name} aus dem Sortiment geworfen`);
  renderPanel(); save();
};

};
window.buyKasse=function(){ if(S.kassen<LV().maxK && pay(cost(300))){ S.kassen++; toast("🧾 Neue Kasse eröffnet!"); renderPanel(); save(); } };
window.buyScan=function(){ if(S.selfscans<LV().maxS && pay(cost(180))){ S.selfscans++; toast("🖥️ Neuer Self-Scanning-Automat!"); renderPanel(); save(); } };
window.buyDept=function(k){
  if(S.depts.includes(k)) return;
  if(!pay(cost(DEPTS[k].cost))) return;
  S.depts.push(k);
  buildLayout();
  toast(`${DEPTS[k].emoji} Abteilung ${DEPTS[k].name} angebaut – dein Laden ist gewachsen! 🏗️`, true);
  renderPanel(); save();
};
window.buyTier=function(key,max,prices,zeroBase){
  const cur=S[key];
  const idx=(zeroBase===0)? cur : cur-1;
  if(cur>=max) return;
  if(!pay(cost(prices[idx]))) return;
  S[key]=cur+1;
  const names={shelfTier:"Regal-System",kasseTier:"Kassen-Tempo",scanTier:"Self-Scan-Tempo",staffRoomLvl:"Personalraum",parkMeterTier:"Parkuhr"};
  toast(`⬆️ ${names[key]||key}: Stufe ${S[key]}!`);
  if(key==="shelfTier") toast("🗄️ Alle Regale haben jetzt Platz für ein weiteres Produkt!", true);
  renderPanel(); save();
};
window.buyParking=function(){
  const L=LV();
  if(S.parking>=L.parkCap) return;
  if(!pay(cost(30+S.parking*3))) return;
  S.parking=Math.min(L.parkCap, S.parking+2);
  toast("🅿️ 2 neue Parkplätze markiert!");
  renderPanel(); save();
};
window.buyOffice=function(){
  if(S.office) return;
  if(!pay(cost(450))) return;
  S.office=true;
  toast("🚔 Diebstahlbüro eröffnet – Anzeigen bringen CHF 100!", true);
  renderPanel(); save();
};
window.buyBillboard=function(){ if(!S.billboard && pay(cost(150))){ S.billboard=true; toast("📣 Werbetafel steht – die Leute reden über dich!"); renderPanel(); save(); } };
window.buyBusstop=function(){ if(!S.busstop && pay(cost(400))){ S.busstop=true; R.bus=8; toast("🚌 Bushaltestelle gebaut – der erste Bus kommt gleich!"); renderPanel(); save(); } };
window.buyReno=function(){ if(!S.reno && pay(cost(500))){ S.reno=true; toast("✨ Frisch renoviert – dein Laden glänzt!"); renderPanel(); save(); } };

/* ---- Regal-Popup ---- */
function openShelf(id){
  const slot=slotById(id);
  const d=shelfData(id);
  const zoneName = slot.zone==="hall" ? "Halle" : DEPTS[slot.zone].emoji+" "+DEPTS[slot.zone].name;
  const slvl=d.lvl||1, cap=shelfCap(id);
  let html=`<h2>🗄️ Regal (${zoneName})</h2>
  <div class="sub">${d.parts.length} Produktplatz${d.parts.length>1?"̈e":""} · Regal-Stufe ${slvl}/5 · ${cap} Stk. pro Platz</div>`;
  html+=`<div class="row"><div class="em">${slvl>=5?"⭐":"⬆️"}</div>
    <div class="info"><b>Regal-Stufe ${"▮".repeat(slvl)}${"▯".repeat(5-slvl)}</b>
    <small>${slvl<5? "Nächste Stufe: "+SHELF_CAPS[slvl]+" Stk. pro Platz – und das Regal sieht edler aus." : "Premium-Regal: 50 Stk. pro Platz."}</small></div>
    ${slvl>=5?'<span class="tag hit">✓ max</span>':`<button class="btn" onclick="upgradeShelf('${id}')">${fmtS(cost(SHELF_UP[slvl-1]))}</button>`}
  </div>`;
  const taken=new Set();
  Object.values(S.shelves).forEach(sh=>(sh.parts||[]).forEach(pt=>{ if(pt.prod) taken.add(pt.prod); }));
  d.parts.forEach((pt,pi)=>{
    if(pt.prod){
      const p=P[pt.prod];
      const lag=S.lager[pt.prod]||0;
      html+=`<div class="row">
        <div class="em">${p.emoji}</div>
        <div class="info"><b>${p.name}${isLiq(pt.prod)?' <span class="tag season">🏷️ −'+Math.round(S.liqPct*100)+'%</span>':''}${isPromo(pt.prod)?' <span class="tag hit">🔥 Aktion</span>':''}</b>
        <small>${pt.units}/${cap} im Regal · ${lag} im Lager · VK ${fmt(vkEff(pt.prod))}</small>
        <div style="height:6px;background:#e5e9ec;border-radius:3px;margin-top:5px;overflow:hidden">
          <i style="display:block;height:6px;width:${Math.round(pt.units/cap*100)}%;
             background:${pt.units===0?"#d33a2f":pt.units<cap*0.3?"#e8a13a":"#39c46e"}"></i>
        </div></div>
        <div style="display:flex;gap:6px;flex-shrink:0">
          <button class="btn sec" onclick="clearShelfPart('${id}',${pi})">✕</button>
          <button class="btn green" onclick="refillPart('${id}',${pi})" ${lag<=0||pt.units>=cap?"disabled":""}>📦 Auffüllen</button>
        </div>
      </div>`;
    }else{
      const options=S.assortment.filter(pid=>{
        if(taken.has(pid)) return false;
        if(slot.zone==="hall") return S.depts.includes(P[pid].dept);
        return P[pid].dept===slot.zone;
      });
      html+=`<div class="secTitle">Platz ${pi+1}: Produkt wählen</div>`;
      if(options.length){
        html+=`<div class="chipRow">`+options.map(pid=>
          `<button class="chip big" onclick="assignShelfPart('${id}',${pi},'${pid}')">${P[pid].emoji}</button>`).join("")+`</div>`;
      }else{
        html+=`<p style="font-size:12.5px;color:var(--ink-soft)">Kein passendes freies Produkt im Sortiment.</p>`;
      }
    }
  });
  const canFill=d.parts.some(pt=>pt.prod && pt.units<cap && (S.lager[pt.prod]||0)>0);
  html+=`<button class="btn green" onclick="refillAllParts('${id}')" ${canFill?"":"disabled"}>📦 Alle Plätze auffüllen</button>`;
  html+=`<button class="btn sec" style="margin-top:8px" onclick="closeDialog()">Schliessen</button>`;
  showDialog(html);
}
window.refillAllParts=function(id){
  let n=0;
  const cap=shelfCap(id);
  shelfData(id).parts.forEach(pt=>{
    if(!pt.prod) return;
    const add=Math.min(cap-pt.units, S.lager[pt.prod]||0);
    pt.units+=add; S.lager[pt.prod]-=add; n+=add;
  });
  const slot=slotById(id);
  if(n>0) effects.push({x:slot.x,y:slot.y-20,txt:"+"+n+" 📦",t:1.2,col:"#1f8a4d"});
  closeDialog(); save();
};
window.refillPart=function(id,pi){
  const pt=shelfData(id).parts[pi];
  const lag=S.lager[pt.prod]||0;
  const n=Math.min(shelfCap(id)-pt.units, lag);
  pt.units+=n; S.lager[pt.prod]-=n;
  const slot=slotById(id);
  effects.push({x:slot.x,y:slot.y-24,txt:"+"+n+" 📦",t:1.2,col:"#1f8a4d"});
  closeDialog(); save();
};
window.assignShelfPart=function(id,pi,pid){
  const pt=shelfData(id).parts[pi];
  pt.prod=pid; pt.units=0;
  closeDialog(); openShelf(id);
};
window.upgradeShelf=function(id){
  const d=shelfData(id);
  const lvl=d.lvl||1;
  if(lvl>=5) return;
  if(!pay(cost(SHELF_UP[lvl-1]))) return;
  d.lvl=lvl+1;
  const slot=slotById(id);
  effects.push({x:slot.x,y:slot.y-24,txt:"⬆️ Stufe "+d.lvl,t:1.4,col:"#1f8a4d"});
  toast(`🗄️ Regal auf Stufe ${d.lvl}: jetzt ${shelfCap(id)} Stk. pro Platz!`);
  closeDialog(); openShelf(id); save();
};
window.clearShelfPart=function(id,pi){
  const pt=shelfData(id).parts[pi];
  if(pt.prod && pt.units>0){ S.lager[pt.prod]=(S.lager[pt.prod]||0)+pt.units; }
  pt.prod=null; pt.units=0;
  closeDialog(); openShelf(id);
};

/* ================= HUD & LOOP ================= */
function updateHUD(){
  $("uiMoney").textContent=fmtS(S.money);
  $("uiMoney").style.color = S.money<0 ? "#ff8a7a" : "#ffd28f";
  if(window.__lastMoney===undefined) window.__lastMoney=S.money;
  const mDelta=S.money-window.__lastMoney;
  if(Math.abs(mDelta)>=0.005){
    window.__lastMoney=S.money;
    const box=$("moneyFx");
    if(box){
      const el=document.createElement("div");
      el.className="mfx "+(mDelta>0?"plus":"minus");
      el.textContent=(mDelta>0?"+":"−")+fmt(Math.abs(mDelta));
      box.appendChild(el);
      while(box.children.length>4) box.removeChild(box.firstChild);
      setTimeout(()=>{ if(el.parentNode) el.parentNode.removeChild(el); }, 1650);
    }
  }
  $("uiDay").textContent=(S.shopName?S.shopName+" · ":"")+`Tag ${S.day}`;
  $("uiDay").title=season();
  $("uiClock").textContent=clockStr()+" · "+SEASON_EMOJI[season()]+" · Lv."+(S.level+1);
  $("uiClean").style.width=cleanPct()+"%";
  $("uiClean").style.background = cleanPct()>50 ? "var(--green)" : cleanPct()>25 ? "#e8a13a" : "var(--red)";
  $("uiMood").style.width=Math.round(S.mood||85)+"%";
  $("uiMood").style.background = S.mood>50 ? "var(--green)" : S.mood>25 ? "#e8a13a" : "var(--red)";
}
let last=performance.now();
let lastRender=0, lastHud=0;
function loop(now){
  const dt=Math.min(0.1,(now-last)/1000); last=now;
  tick(dt);
  if(now-lastRender>=(paused?85:Math.round(1000/(S.fps||30)))){ lastRender=now; render(); }
  if(now-lastHud>=120){ lastHud=now; updateHUD(); }
  requestAnimationFrame(loop);
}

window.tutorialStep=tutorialStep;
window.skipTutorial=function(){
  closeDialog(); S.tutorialDone=true; paused=false; save();
  toast("Viel Erfolg, Chef! 💪");
};
function tutorial(){ tutorialStep(1); }
function boot(){
  const hadSave=load();
  ensureStats();
  buildLayout();
  resize();
  camCenterDoor();
  requestAnimationFrame(loop);
  if(!S.shopName){ askName(0); }
  else if(!hadSave || !S.tutorialDone){ giftDialog(); }
  else{ offlineSim(); }
  if(!canStore) toast("⚠️ Speichern hier nicht möglich – auf GitHub Pages klappt's!");
  setTimeout(()=>{ if(!PTR.hinted) $("panHint").style.opacity=0; }, 8000);
}
document.addEventListener("visibilitychange",()=>{ if(document.hidden) save(); });
window.addEventListener("pagehide",save);
boot();
